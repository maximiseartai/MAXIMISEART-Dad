id: komentarz-w-src
language: python
severity: error
message: >-
  komentarz # w src: powód i ostrzeżenie z komentarza wyraź lepszą nazwą albo testem, który pada bez tego kodu, a
  historię zmiany zostaw w PR albo issue; w src zostają tylko tłumienia ruff i mypy (noqa: z kodem i type: ignore na
  linii, którą tłumią, a ruff: noqa i mypy: w nagłówku modułu, przed pierwszą instrukcją), a powód tłumienia dopisz na
  jego linii (ADR 0034, „Komentarze w src”)
files:
  - src/**
rule:
  kind: comment
  # Przechodzi tylko tłumienie, które czyta ruff albo mypy, bo ono samo odrzuca prozę zamiast kodu: noqa i noqa: z kodem
  # (PGH004, RUF100), type: ignore (mypy: Invalid "type: ignore" comment). Pliku ruff: noqa i mypy: (dokładnie „# mypy: ”,
  # jak w get_mypy_comments) ruff i mypy nie czytają obok kodu, a ast-grep nie widzi kolumny, więc oba przechodzą tylko
  # w nagłówku modułu: przed nimi nie stoi żaden węzeł poza komentarzem (komentarz w nawiasie, bloku albo po kodzie ma
  # przed sobą token rodzica), więc stoją na własnej linii, a mypy odrzuca tam nieznaną opcję (Unrecognized option).
  not:
    any:
      - regex: '^#\s*(?:(?i:noqa)(?::\s*[A-Z]+[0-9]+|\s|$)|type:\s*ignore\b)'
      - all:
          - regex: '^(?:#\s*ruff:\s*noqa(?::\s*[A-Z]+[0-9]+|\s|$)|# mypy: )'
          - not:
              follows:
                not:
                  kind: comment
                stopBy: end
