id: komentarz-w-src
language: python
severity: error
message: >-
  komentarz # w src: to, co mówi komentarz, wyraź nazwą albo testem, który pada bez tego kodu, decyzję zapisz w ADR,
  motywację domenową w GLOSSARY.md, a historię zmiany w opisie PR; zostaje tylko komentarz, który w całości ma jedną
  z postaci: „# noqa: F401 - powód” (kody ruff rozdzielone „, ”, potem „ - ” i powód), „# type: ignore[attr-defined]”
  (kody mypy rozdzielone „, ”, potem koniec komentarza albo „  # powód”), „# ZEWNĘTRZNE: fakt (źródło)” (ograniczenie
  świata poza repo) albo „#!/usr/bin/env python3” w pierwszej linii, bez numeru issue („#” i cyfra) i adresu
  github.com/maximiseartai/; reguła czyta pliki .py, .pyi i .py3 w src, a plik .pyw i plik bez rozszerzenia pomija
files:
  - src/**/*.py
  - src/**/*.pyi
  - src/**/*.py3
metadata:
  przypadki:
    - 6e6c7c376daa162c3679137915502468ef34df95 src/rozliczenia/centrum/report_entering_logs.py:649
rule:
  kind: comment
  any:
    - regex: >-
        (?i:#\d|github\.com/maximiseartai/)
    - not:
        any:
          - regex: >-
              ^# (?:noqa: [A-Z]+[0-9]+(?:, [A-Z]+[0-9]+)* - \S.*|type: ignore\[[a-z]+(?:-[a-z]+)*(?:, [a-z]+(?:-[a-z]+)*)*\](?:  # \S.*)?)\r?$
          - regex: >-
              ^# ZEWNĘTRZNE: \S.* \(\S(?:[^()]*\S)?\)\r?$
          - all:
              - regex: >-
                  ^#!/usr/bin/env python3\r?$
              - nthChild: 1
              - inside:
                  kind: module
