id: definicja-pythona-wzorcem
language: python
severity: error
message: >-
  wzorzec re na def albo class nie czyta definicji Pythona: łapie też linię napisu, użycie nazwy po imporcie i definicję
  w funkcji, a gubi przypisanie; definicje modułu czytaj z ast.parse (FunctionDef, AsyncFunctionDef, ClassDef, cele
  Assign i AnnAssign)
files:
  - tools/**/*.py
  - .agents/skills/*/scripts/**/*.py
  - src/**/*.py
  - tests/**/*.py
metadata:
  przypadki:
    - 2524/W1/r1
rule:
  kind: string
  regex: '(^|[^\w])(def|class)\)?( |\\s)'
  inside:
    kind: call
    stopBy: end
    has:
      field: function
      regex: '^re\.(compile|search|match|fullmatch|finditer|findall|sub|subn|split)$'
