id: znak-powloki-jako-test-literalu
language: python
severity: error
message: >-
  słowo polecenia uznane za literał, bo nie ma w nim wyliczonego znaku powłoki ("$" in słowo): każda postać spoza
  wyliczenia (znacznik xargs -I{}, %, glob) przechodzi jako literał; sprawdzaj pełnym dopasowaniem postaci literału
  (WZORZEC.fullmatch(słowo)), a nie brakiem znaku powłoki
files:
  - tools/hooks/**/*.py
metadata:
  przypadki:
    - 2289/W1/r2
rule:
  kind: comparison_operator
  regex: '^["''][$`*?{}%]["'']\s+(not\s+)?in\b'
