id: postac-tlumienia-poza-wlascicielem
language: python
severity: error
message: >-
  jeden literał wzorca re z # i dalej postacią tłumienia ruff albo mypy (noqa, ruff:, flake8:, type…:…ignore) przepisuje
  postać tłumienia poza jej właścicielem: ręczna kopia gubi postacie, które narzędzie czyta (# NOQA: KOD, # flake8: noqa,
  komentarz typu # type: list[int]); weź RUFF z tests/test_granice_wyjatkow.py, a type: ignore z ast.parse(...,
  type_comments=True); dyrektywę # mypy: pilnuje reguła dyrektywa-mypy-recznie
files:
  - "**/*.py"
ignores:
  - tests/test_granice_wyjatkow.py
metadata:
  przypadki:
    - 2311/W1/r2
rule:
  # Znacznik komentarza #, za nim cokolwiek, potem postać tłumienia ruff albo type: ignore (z dowolnymi znakami wokół
  # dwukropka): klasa wzorca, który szuka komentarza tłumienia, a nie lista zapisów odstępu.
  kind: string
  regex: '#.*(?i:noqa|ruff:|flake8:|type[^:\n]*:.*ignore)'
  inside:
    kind: call
    stopBy: end
    has:
      field: function
      regex: '^re\.(compile|search|match|fullmatch|finditer|findall|sub|subn|split)$'
