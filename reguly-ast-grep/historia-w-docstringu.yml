id: historia-w-docstringu
language: python
severity: error
message: >-
  odwołanie do PR, issue albo commitu (numer, adres github.com, skrót commitu) w docstringu src: historię zmiany zostaw
  w opisie PR albo w issue, a docstring niech mówi, co kod robi teraz (ADR 0034, „Komentarze w src”)
files:
  - src/**
rule:
  any:
    - kind: string
    - kind: concatenated_string
  inside:
    kind: expression_statement
    nthChild:
      position: 1
      ofRule:
        not:
          kind: comment
    inside:
      any:
        - kind: module
        - kind: block
          inside:
            any:
              - kind: function_definition
              - kind: class_definition
  # Odwołanie do PR, issue albo commitu w postaci, którą GitHub sam zamienia w link (#N i o/r#N, GH-N, adres github.com
  # poza hostami api. i uploads., skrót commitu i o@skrót), ścieżka /commit/ ze skrótem, oraz rzeczownik obiektu GitHuba
  # (PR, pull, pull request, issue, ticket, commit, z odmianą, „nr”, „numer” albo ścieżką /issues/) przed numerem. Skrót commitu to słowo z 7 albo więcej znaków 0-9a-f,
  # w którym są i cyfra, i litera, więc numer telefonu z samych cyfr nie jest skrótem. Regex ast-grep nie ma lookahead,
  # więc każda gałąź skrótu mówi, ile znaków jednego rodzaju stoi przed pierwszym znakiem drugiego.
  regex: >-
    #\d|\b(?i:gh)-\d|(?:^|[^\w.-])(?:www\.)?github\.com/|/commit/(?i:[0-9a-f])|\b(?i:pr(?:-\w+)?|pull(?:\s+request\w*)?|issue\w*|ticket\w*|commit\w*)[\s/-]*(?i:(?:nr|numer|no)\.?\s*)?\d|\b(?:[0-9][a-f][0-9a-f]{5}|[0-9]{2}[a-f][0-9a-f]{4}|[0-9]{3}[a-f][0-9a-f]{3}|[0-9]{4}[a-f][0-9a-f]{2}|[0-9]{5}[a-f][0-9a-f]|[0-9]{6,}[a-f]|[a-f][0-9][0-9a-f]{5}|[a-f]{2}[0-9][0-9a-f]{4}|[a-f]{3}[0-9][0-9a-f]{3}|[a-f]{4}[0-9][0-9a-f]{2}|[a-f]{5}[0-9][0-9a-f]|[a-f]{6,}[0-9])[0-9a-f]*\b
