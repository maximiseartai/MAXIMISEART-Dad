id: historia-w-docstringu
language: python
severity: error
message: >-
  numer PR albo issue albo skrót commitu w docstringu src: historię zmiany zostaw w opisie PR albo w issue, a docstring
  niech mówi, co kod robi teraz (ADR 0034, „Komentarze w src”)
files:
  - src/**
rule:
  any:
    - kind: string
    - kind: concatenated_string
  inside:
    kind: expression_statement
    nthChild:
      position: 1
      ofRule:
        not:
          kind: comment
    inside:
      any:
        - kind: module
        - kind: block
          inside:
            any:
              - kind: function_definition
              - kind: class_definition
  # Numer PR albo issue (#123, PR 123, PR-123, /pull/123), adres commitu (/commit/…) i skrót commitu: słowo z 7 albo
  # więcej znaków 0-9a-f, w którym są i cyfra, i litera, więc numer telefonu z samych cyfr nie jest skrótem. Regex
  # ast-grep nie ma lookahead, więc każda gałąź mówi, ile znaków jednego rodzaju stoi przed pierwszym znakiem drugiego.
  regex: >-
    #\d|\bPR[-\s]?\d|/pull/\d|/commit/[0-9a-f]|\b(?:[0-9][a-f][0-9a-f]{5}|[0-9]{2}[a-f][0-9a-f]{4}|[0-9]{3}[a-f][0-9a-f]{3}|[0-9]{4}[a-f][0-9a-f]{2}|[0-9]{5}[a-f][0-9a-f]|[0-9]{6,}[a-f]|[a-f][0-9][0-9a-f]{5}|[a-f]{2}[0-9][0-9a-f]{4}|[a-f]{3}[0-9][0-9a-f]{3}|[a-f]{4}[0-9][0-9a-f]{2}|[a-f]{5}[0-9][0-9a-f]|[a-f]{6,}[0-9])[0-9a-f]*\b
