id: historia-w-docstringu
language: python
severity: error
message: >-
  odwołanie do PR, issue albo commitu (# z numerem, adres w domenie github.com poza api.github.com i
  uploads.github.com, skrót commitu) w docstringu src: historię zmiany zostaw w opisie PR albo w issue, a docstring
  niech mówi, co kod robi teraz (ADR 0034, „Komentarze w src”)
files:
  - src/**
rule:
  any:
    - kind: string
    - kind: concatenated_string
  inside:
    kind: expression_statement
    nthChild:
      position: 1
      ofRule:
        not:
          kind: comment
    inside:
      any:
        - kind: module
        - kind: block
          inside:
            any:
              - kind: function_definition
              - kind: class_definition
  # Trzy znaki o jednoznacznej składni: # z cyfrą (#N, o/r#N); adres w domenie github.com, czyli github.com na dowolnym
  # hoście poza api.github.com i uploads.github.com, których kod używa; skrót commitu, czyli słowo z 7 albo więcej
  # znaków 0-9a-f, w którym są i cyfra, i litera. Numer po słowie (PR 12, issue 1614) zostaje recenzentowi i jest
  # próbką ZNANE_LUKI. Regex ast-grep nie ma lookahead ani lookbehind, więc host inny niż api i uploads wylicza po
  # długości etykiety i pozycji pierwszej różnej litery, a skrót mówi, ile znaków jednego rodzaju stoi przed drugim.
  regex: >-
    #\d|(?i:(?:^|[^\w.\-])(?:[\w\-]{1,2}\.|[\w\-]{4,6}\.|[\w\-]{8,}\.|[\w\-]+\.[\w\-]+(?:\.[\w\-]+)*\.|[[\w\-]&&[^a]][\w\-]{2}\.|a[[\w\-]&&[^p]][\w\-]\.|ap[[\w\-]&&[^i]]\.|[[\w\-]&&[^u]][\w\-]{6}\.|u[[\w\-]&&[^p]][\w\-]{5}\.|up[[\w\-]&&[^l]][\w\-]{4}\.|upl[[\w\-]&&[^o]][\w\-]{3}\.|uplo[[\w\-]&&[^a]][\w\-]{2}\.|uploa[[\w\-]&&[^d]][\w\-]\.|upload[[\w\-]&&[^s]]\.)?github\.com\b)|\b(?:[0-9][a-f][0-9a-f]{5}|[0-9]{2}[a-f][0-9a-f]{4}|[0-9]{3}[a-f][0-9a-f]{3}|[0-9]{4}[a-f][0-9a-f]{2}|[0-9]{5}[a-f][0-9a-f]|[0-9]{6,}[a-f]|[a-f][0-9][0-9a-f]{5}|[a-f]{2}[0-9][0-9a-f]{4}|[a-f]{3}[0-9][0-9a-f]{3}|[a-f]{4}[0-9][0-9a-f]{2}|[a-f]{5}[0-9][0-9a-f]|[a-f]{6,}[0-9])[0-9a-f]*\b
