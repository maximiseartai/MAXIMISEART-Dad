id: regula-w-trasie
language: python
severity: error
message: >-
  odmowa w trasie HTTP, która zmienia Ustawienia, to druga droga reguły, którą „Cofnij” w Historii omija: przenieś
  regułę do właściciela Ustawień (CentrumSettings._checked albo _dad_change w settings/owner.py) i zwróć z trasy jego
  wynik
files:
  - src/rozliczenia/centrum/**/*.py
utils:
  # Wynik właściciela: case klasy z wyniku metod CentrumSettings (settings/owner.py), bez strażnika if.
  case-wyniku-wlasciciela:
    kind: case_clause
    not:
      has:
        kind: if_clause
    has:
      kind: case_pattern
      has:
        kind: class_pattern
        has:
          kind: dotted_name
          regex: '^(\w+\.)*(Saved|Refused|NotSaved|KeptInPeriods|NotUndoable)$'
rule:
  # Regułę przyjęcia zmiany ma tylko właściciel Ustawień (#1533, #1585 (a)); powroty #1585 W1 r1 (_ensure_not_in_periods w
  # trasie DELETE) i #1577 W1 r3 (odmowa needed_by w trasie formularza). Trasą Ustawień jest moduł, który nazywa APIRouter
  # (tworzy go, importuje pod aliasem albo bierze z parametru, bo mypy strict i ANN401 wymuszają adnotację) i zmienia
  # Ustawienia przez metodę zapisu właściciela, jakkolwiek się nazywa (#1727 r1 W1: quantity_differences.py, r2 W1: router
  # z parametru i alias). Zakres to cały taki moduł, bo trasy wołają zagnieżdżone funkcje pomocnicze bez dekoratora.
  # Zgłoszone jest każde wywołanie funkcji katalogu odmów (refusal.…) poza kształtami z listy not: niżej i każde wywołanie
  # sprawdzenia _ensure_*. Każdy dozwolony kształt to raise wprost w bloku gałęzi (inside bez stopBy sięga tylko do
  # rodzica), a dozwolony if stoi wprost w ciele funkcji albo w case wyniku właściciela, więc odmowa w innej gałęzi, pod
  # drugim if, w pętli, w return albo w wyrażeniu warunkowym jest zgłoszona bez wyliczania składni.
  # Postacie, których reguła nie łapie, są próbkami ZNANE_LUKI_REGULY_W_TRASIE w tests/test_zapadki.py.
  all:
    - inside:
        kind: module
        stopBy: end
        all:
          - has:
              stopBy: end
              kind: identifier
              regex: '^APIRouter$'
          - has:
              stopBy: end
              kind: call
              has:
                field: function
                kind: attribute
                has:
                  field: attribute
                  regex: '^(change|change_with_used_keys|undo|apply_release_changes)$'
    - any:
        - kind: call
          has:
            field: function
            regex: '^refusal\.\w+$'
          not:
            any:
              # 404 nieznanego id: obiektu, o który pyta trasa, nie ma, więc nie ma czego sprawdzać regułą.
              - has:
                  field: function
                  regex: '^refusal\.\w+_unknown$'
              - inside:
                  kind: raise_statement
                  inside:
                    kind: block
                    inside:
                      matches: case-wyniku-wlasciciela
              # Wynik właściciela albo formularza sprawdzony isinstance i brak wartości do odczytu: blok samego if,
              # którego cały warunek to isinstance(x, C) albo x is None, a sam if stoi wprost w ciele funkcji albo w
              # case wyniku właściciela.
              - inside:
                  kind: raise_statement
                  inside:
                    kind: block
                    inside:
                      kind: if_statement
                      inside:
                        kind: block
                        inside:
                          any:
                            - kind: function_definition
                            - matches: case-wyniku-wlasciciela
                      has:
                        field: condition
                        any:
                          - pattern: isinstance($_, $C)
                          - pattern: $_ is None
                        not:
                          has:
                            field: arguments
                            has:
                              nthChild: 2
                              not:
                                regex: '^(\w+\.)*(Saved|Refused|NotSaved|KeptInPeriods|NotUndoable|Unreadable|FieldProblem)$'
        - kind: call
          has:
            field: function
            regex: '(^|\.)_ensure_\w*$'
