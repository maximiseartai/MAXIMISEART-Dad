id: regula-w-trasie
language: python
severity: error
message: >-
  odmowa obok zapisu Ustawień poza ich właścicielem to druga droga reguły, którą „Cofnij” w Historii omija: przenieś
  regułę do właściciela Ustawień (CentrumSettings._checked albo _dad_change w settings/owner.py) i odmawiaj tylko na
  podstawie jego wyniku
files:
  - src/rozliczenia/centrum/**/*.py
# Prawo właściciela Ustawień: settings/owner.py sprawdza reguły przyjęcia zmiany, do niego komunikat kieruje resztę kodu.
ignores:
  - src/rozliczenia/centrum/settings/owner.py
utils:
  # Wynik właściciela: case klasy z wyniku metod CentrumSettings (settings/owner.py), bez strażnika if.
  case-wyniku-wlasciciela:
    kind: case_clause
    not:
      has:
        kind: if_clause
    has:
      kind: case_pattern
      has:
        kind: class_pattern
        has:
          kind: dotted_name
          regex: '^(\w+\.)*(Saved|Refused|NotSaved|KeptInPeriods|NotUndoable)$'
rule:
  # Regułę przyjęcia zmiany ma tylko właściciel Ustawień (#1533, #1585 (a)); powroty #1585 W1 r1 (_ensure_not_in_periods w
  # trasie DELETE) i #1577 W1 r3 (odmowa needed_by w trasie formularza). Zakres wynika z własności, nie ze składni trasy
  # (#1727 r1–r3: nazwa pliku, APIRouter(…), identyfikator APIRouter nie widziały FastAPI ani adnotacji napisem), ani z
  # postaci wywołania (#1727 r4: getattr(settings, "change")(…), settings._dad_change(…)): każdy moduł Centrum poza
  # właścicielem, który nazywa metodę zapisu właściciela gdziekolwiek, atrybutem albo literałem napisu, cały, bo trasy,
  # middleware i funkcje pomocnicze sprawdzają regułę obok zapisu. Metody zapisu: publiczne CentrumSettings.change,
  # change_with_used_keys, undo, apply_release_changes i prywatne, które zapisują albo sprawdzają regułę przyjęcia
  # (_by_dad, _dad_change, _dad_devices, _dad_rules, _change, _checked, _apply, _apply_pending, _refuse, _put_back,
  # _remember): wołanie prywatnej metody właściciela spoza niego to ten sam zapis.
  # Zgłoszone jest każde wywołanie funkcji katalogu odmów (refusal.…) poza kształtami z listy not: niżej i każde wywołanie
  # sprawdzenia _ensure_*. Każdy dozwolony kształt to raise wprost w bloku gałęzi (inside bez stopBy sięga tylko do
  # rodzica), a dozwolony if stoi wprost w ciele funkcji albo w case wyniku właściciela, więc odmowa w innej gałęzi, pod
  # drugim if, w pętli, w return albo w wyrażeniu warunkowym jest zgłoszona bez wyliczania składni.
  # Postacie, których reguła nie łapie, są próbkami ZNANE_LUKI_REGULY_W_TRASIE w tests/test_zapadki.py.
  all:
    - inside:
        kind: module
        stopBy: end
        has:
          stopBy: end
          any:
            - kind: attribute
              has:
                field: attribute
                regex: '^(change|change_with_used_keys|undo|apply_release_changes|_by_dad|_dad_change|_dad_devices|_dad_rules|_change|_checked|_apply|_apply_pending|_refuse|_put_back|_remember)$'
            - kind: string
              regex: '^[''"](change|change_with_used_keys|undo|apply_release_changes|_by_dad|_dad_change|_dad_devices|_dad_rules|_change|_checked|_apply|_apply_pending|_refuse|_put_back|_remember)[''"]$'
    - any:
        - kind: call
          has:
            field: function
            regex: '^refusal\.\w+$'
          not:
            any:
              # 404 nieznanego id: obiektu, o który pyta trasa, nie ma, więc nie ma czego sprawdzać regułą.
              - has:
                  field: function
                  regex: '^refusal\.\w+_unknown$'
              - inside:
                  kind: raise_statement
                  inside:
                    kind: block
                    inside:
                      matches: case-wyniku-wlasciciela
              # Wynik właściciela albo formularza sprawdzony isinstance i brak wartości do odczytu: blok samego if,
              # którego cały warunek to isinstance(x, C) albo x is None, a sam if stoi wprost w ciele funkcji albo w
              # case wyniku właściciela.
              - inside:
                  kind: raise_statement
                  inside:
                    kind: block
                    inside:
                      kind: if_statement
                      inside:
                        kind: block
                        inside:
                          any:
                            - kind: function_definition
                            - matches: case-wyniku-wlasciciela
                      has:
                        field: condition
                        any:
                          - pattern: isinstance($_, $C)
                          - pattern: $_ is None
                        not:
                          has:
                            field: arguments
                            has:
                              nthChild: 2
                              not:
                                regex: '^(\w+\.)*(Saved|Refused|NotSaved|KeptInPeriods|NotUndoable|Unreadable|FieldProblem)$'
        - kind: call
          has:
            field: function
            regex: '(^|\.)_ensure_\w*$'
