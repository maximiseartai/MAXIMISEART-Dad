id: regula-w-trasie
language: python
severity: error
message: >-
  odmowa w trasie HTTP obok właściciela Ustawień to druga droga, którą „Cofnij” w Historii omija; użyj sprawdzenia u
  właściciela Ustawień (CentrumSettings._checked albo _dad_change w settings/owner.py), a trasa niech tylko tłumaczy
  jego wynik: raise wprost w case klasy wyniku (case Refused(problem=p):), raise wprost pod if isinstance(x, C) z klasą
  wyniku, Unreadable albo FieldProblem formularza, raise wprost pod if x is None (nie ma czego czytać) albo 404
  refusal.*_unknown
files:
  - src/rozliczenia/centrum/**/*router*.py
rule:
  # Regułę przyjęcia zmiany ma tylko właściciel Ustawień (#1533, #1585 (a)); powroty #1585 W1 r1 (_ensure_not_in_periods
  # w trasie DELETE) i #1577 W1 r3 (odmowa needed_by w trasie formularza). Zgłoszone jest każde wywołanie funkcji
  # katalogu odmów (refusal.…) w module trasy, poza kształtami z listy not: niżej, i każde wywołanie sprawdzenia
  # _ensure_*. Każdy dozwolony kształt to raise wprost w bloku gałęzi (inside bez stopBy sięga tylko do rodzica), więc
  # odmowa w innej gałęzi, pod drugim if, w pętli, w return albo w wyrażeniu warunkowym jest zgłoszona bez wyliczania
  # składni. Zakres to cały moduł *router*.py, bo trasy wołają zagnieżdżone funkcje pomocnicze bez dekoratora.
  # Postacie, których reguła nie łapie, są próbkami ZNANE_LUKI_REGULY_W_TRASIE w tests/test_zapadki.py.
  any:
    - kind: call
      has:
        field: function
        regex: '^refusal\.\w+$'
      not:
        any:
          # 404 nieznanego id: obiektu, o który pyta trasa, nie ma, więc nie ma czego sprawdzać regułą.
          - has:
              field: function
              regex: '^refusal\.\w+_unknown$'
          # Wynik właściciela: case klasy z wyniku metod CentrumSettings (settings/owner.py), bez strażnika if.
          - inside:
              kind: raise_statement
              inside:
                kind: block
                inside:
                  kind: case_clause
                  not:
                    has:
                      kind: if_clause
                  has:
                    kind: case_pattern
                    has:
                      kind: class_pattern
                      has:
                        kind: dotted_name
                        regex: '^(\w+\.)*(Saved|Refused|NotSaved|KeptInPeriods|NotUndoable)$'
          # Wynik właściciela albo formularza sprawdzony isinstance i brak wartości do odczytu: blok samego if,
          # którego cały warunek to isinstance(x, C) albo x is None.
          - inside:
              kind: raise_statement
              inside:
                kind: block
                inside:
                  kind: if_statement
                  has:
                    field: condition
                    any:
                      - pattern: isinstance($_, $C)
                      - pattern: $_ is None
                    not:
                      has:
                        field: arguments
                        has:
                          nthChild: 2
                          not:
                            regex: '^(\w+\.)*(Saved|Refused|NotSaved|KeptInPeriods|NotUndoable|Unreadable|FieldProblem)$'
    - kind: call
      has:
        field: function
        regex: '(^|\.)_ensure_\w*$'
