id: regula-w-trasie
language: python
severity: error
message: >-
  odmowa obok zapisu Ustawień poza ich właścicielem to druga droga reguły, którą „Cofnij” w Historii omija: przenieś
  regułę do właściciela Ustawień (CentrumSettings._checked albo _dad_change w settings/owner.py) i odmawiaj tylko na
  podstawie jego wyniku; moduł, który Ustawienia tylko czyta, bierze SettingsReads zamiast CentrumSettings
files:
  - src/rozliczenia/centrum/**/*.py
# Prawo właściciela Ustawień: settings/owner.py sprawdza reguły przyjęcia zmiany, do niego komunikat kieruje resztę kodu.
ignores:
  - src/rozliczenia/centrum/settings/owner.py
utils:
  # Wynik właściciela: case klasy z wyniku metod CentrumSettings (settings/owner.py), bez strażnika if.
  case-wyniku-wlasciciela:
    kind: case_clause
    not:
      has:
        kind: if_clause
    has:
      kind: case_pattern
      has:
        kind: class_pattern
        has:
          kind: dotted_name
          regex: '^(\w+\.)*(Saved|Refused|NotSaved|KeptInPeriods|NotUndoable)$'
metadata:
  przypadki:
    - 1585/W1/r1
    - 1577/W1/r3
rule:
  # Regułę przyjęcia zmiany ma tylko właściciel Ustawień (#1533, #1585 (a)); powroty z metadata.przypadki (_ensure_not_in_periods w
  # trasie DELETE i odmowa needed_by w trasie formularza). Zakres wynika z własności, nie ze składni trasy
  # (#1727 r1–r3: nazwa pliku, APIRouter(…), identyfikator APIRouter nie widziały FastAPI ani adnotacji napisem), ani z
  # nazw metod zapisu (lista nazw rosła z każdym plikiem Ustawień w #1904, #1919, #1964 i zgubiła legend_after, #2457):
  # każdy moduł Centrum poza właścicielem, który nazywa typ CentrumSettings (import, adnotacja, także napisem, konstruktor)
  # albo importuje klasę wyniku zapisu właściciela, cały, bo metody zapisu ma CentrumSettings, a własny Protocol z nimi
  # nazywa ich wynik; moduł, który Ustawienia tylko czyta, bierze protokół SettingsReads bez metod zapisu (mypy odmawia
  # zapisu przez niego). Prywatne metody właściciela spoza niego zatrzymuje SLF001 ruff.
  # Zgłoszone jest każde wywołanie funkcji katalogu odmów (refusal.…) poza kształtami z listy not: niżej i każde wywołanie
  # sprawdzenia _ensure_*. Każdy dozwolony kształt to raise wprost w bloku gałęzi (inside bez stopBy sięga tylko do
  # rodzica), a dozwolony if stoi wprost w ciele funkcji albo w case wyniku właściciela, więc odmowa w innej gałęzi, pod
  # drugim if, w pętli, w return albo w wyrażeniu warunkowym jest zgłoszona bez wyliczania składni.
  # Postacie, których reguła nie łapie, są próbkami ZNANE_LUKI_REGULY_W_TRASIE w tests/test_zapadki.py.
  all:
    - inside:
        kind: module
        stopBy: end
        has:
          stopBy: end
          any:
            - kind: identifier
              regex: '^CentrumSettings$'
            # Adnotacja napisem ("CentrumSettings", "owner.CentrumSettings | None"): treść literału daje parser.
            - kind: string_content
              regex: '(^|\W)CentrumSettings(\W|$)'
              inside:
                kind: type
                stopBy: end
            # Własny Protocol z metodą zapisu (#2489 r1 W1) nazywa w wyniku klasę wyniku właściciela: import tej klasy
            # z settings/owner.py (zamknięty zbiór wyników zapisu, ten sam co w case-wyniku-wlasciciela) albo modułu
            # właściciela w całości. Klasa o tej samej nazwie z innego modułu (logs_disk.Refused) zakresu nie daje.
            - kind: import_from_statement
              all:
                - has:
                    field: module_name
                    regex: '^(rozliczenia\.centrum\.settings\.owner|\.+(settings\.)?owner)$'
                - has:
                    field: name
                    regex: '^(Saved|Refused|NotSaved|KeptInPeriods|NotUndoable)( as \w+)?$'
            - kind: import_from_statement
              all:
                - has:
                    field: module_name
                    regex: '^(rozliczenia\.centrum\.settings|\.+(settings)?)$'
                - has:
                    field: name
                    regex: '^owner( as \w+)?$'
            - kind: dotted_name
              regex: '^rozliczenia\.centrum\.settings\.owner$'
              inside:
                kind: import_statement
    - any:
        - kind: call
          has:
            field: function
            regex: '^refusal\.\w+$'
          not:
            any:
              # 404 nieznanego id: obiektu, o który pyta trasa, nie ma, więc nie ma czego sprawdzać regułą.
              - has:
                  field: function
                  regex: '^refusal\.\w+_unknown$'
              - inside:
                  kind: raise_statement
                  inside:
                    kind: block
                    inside:
                      matches: case-wyniku-wlasciciela
              # Wynik właściciela albo formularza sprawdzony isinstance i brak wartości do odczytu: blok samego if,
              # którego cały warunek to isinstance(x, C) albo x is None, a sam if stoi wprost w ciele funkcji albo w
              # case wyniku właściciela.
              - inside:
                  kind: raise_statement
                  inside:
                    kind: block
                    inside:
                      kind: if_statement
                      inside:
                        kind: block
                        inside:
                          any:
                            - kind: function_definition
                            - matches: case-wyniku-wlasciciela
                      has:
                        field: condition
                        any:
                          - pattern: isinstance($_, $C)
                          - pattern: $_ is None
                        not:
                          has:
                            field: arguments
                            has:
                              nthChild: 2
                              not:
                                regex: '^(\w+\.)*(Saved|Refused|NotSaved|KeptInPeriods|NotUndoable|Unreadable|FieldProblem)$'
        - kind: call
          has:
            field: function
            regex: '(^|\.)_ensure_\w*$'
