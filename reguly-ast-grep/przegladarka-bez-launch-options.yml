id: przegladarka-bez-launch-options
language: python
severity: error
message: >-
  start przeglądarki Playwrighta bez argumentów jej właściciela: Chromium na Windows losuje wtedy port lokalny każdego
  połączenia (TcpPortRandomizationWin), a Windows czasem takiego połączenia odmawia (net::ERR_NO_BUFFER_SPACE); podaj
  w tym samym wywołaniu **launch_options(playwright) z rozliczenia.efenix_browser (launch i launch_persistent_context),
  a w teście użyj chromium() z tests/fixtures/przegladarka.py, a dla przeglądarki porównania bez argumentów
  plain_chromium() z tego samego modułu
files:
  - src/**/*.py
  - tools/**/*.py
  - tests/**/*.py
  - .agents/skills/**/*.py
# Prawo właściciela: komunikat kieruje kod do launch_options z efenix_browser.py, a testy do chromium()
# i plain_chromium() z tests/fixtures/przegladarka.py. Reguła zwalnia cały plik, więc WLASCICIELE_PRZEGLADARKI
# w tests/test_zapadki.py trzyma resztę: plik właściciela poza zwolnieniem zgłasza dokładnie swoje starty, każdy
# z argumentem z tabeli.
ignores:
  - src/rozliczenia/efenix_browser.py
  - tests/fixtures/przegladarka.py
rule:
  # Zgłasza każde odwołanie do metody launch albo launch_persistent_context (węzeł attribute w dowolnym miejscu drzewa:
  # wywołanie, argument, przypisanie, partial, to_thread), chyba że to wołana funkcja wywołania, także w nawiasach,
  # którego argumenty mają **launch_options(…) albo **<nazwa>.launch_options(…), albo jej obiekt to nazwa związana
  # importem spoza pakietu playwright w tym pliku (import excel, from rozliczenia.centrum import restart_guardian) albo
  # parametr otaczającej funkcji z typem ModuleType (fikstura modułu), czyli funkcja modułu, a nie metoda przeglądarki.
  # Import z playwright (BrowserType) to klasa przeglądarki, więc BrowserType.launch(p.chromium) jest zgłoszony.
  # Głośno zgłasza też cel przypisania, del i adnotację. Postacie, których drzewo składni nie pokazuje albo które nazwa
  # z importu albo typ ModuleType przepuszcza, są w ZNANE_LUKI_PRZEGLADARKI w tests/test_zapadki.py.
  kind: attribute
  has:
    field: attribute
    regex: '^(?:launch|launch_persistent_context)$'
  not:
    any:
      - inside:
          kind: call
          stopBy:
            not:
              kind: parenthesized_expression
          has:
            field: arguments
            has:
              kind: dictionary_splat
              has:
                kind: call
                has:
                  field: function
                  regex: '^(?:[A-Za-z_]\w*\.)*launch_options$'
      - all:
          - has:
              field: object
              pattern: $MODULE
          - inside:
              kind: function_definition
              stopBy: end
              has:
                has:
                  kind: typed_parameter
                  all:
                    - has:
                        kind: identifier
                        pattern: $MODULE
                    - has:
                        field: type
                        regex: '^(?:[A-Za-z_]\w*\.)*ModuleType$'
      - all:
          - has:
              field: object
              pattern: $MODULE
          - inside:
              kind: module
              stopBy: end
              has:
                stopBy: end
                any:
                  - kind: import_statement
                    has:
                      not:
                        regex: '^playwright\b'
                      any:
                        - kind: dotted_name
                          has:
                            kind: identifier
                            nthChild: 1
                            pattern: $MODULE
                        - kind: aliased_import
                          has:
                            field: alias
                            pattern: $MODULE
                  - kind: import_from_statement
                    not:
                      has:
                        field: module_name
                        regex: '^playwright\b'
                    has:
                      nthChild: n+2
                      any:
                        - kind: dotted_name
                          has:
                            kind: identifier
                            pattern: $MODULE
                        - kind: aliased_import
                          has:
                            field: alias
                            pattern: $MODULE
