id: kotwica-konca-linii
language: python
severity: error
message: >-
  kotwica $ na końcu wzorca re nie pasuje do linii zakończonej \r\n (log zadania Windows z API GitHuba, tekst z bajtów
  bez uniwersalnych końców linii), więc wzorzec po cichu nie widzi linii; użyj \r?$ zamiast $ (albo \s*$, gdy biały
  znak na końcu linii jest dozwolony)
files:
  - tools/**/*.py
metadata:
  przypadki:
    - 1584/W1/r1
    - d03b7f860a58771b0532f29a48fc57f3c705c124 tools/lib/model_tlc.py:70
    - 4b6d731c70fd8eceadc36ee6ce990bc393176c1a tools/mutacje_zmiany.py:66
    - 8a83dacc23898c01669c72d049be196248acf53c tools/ci/shellcheck_akcji.py:34
    - d6bcb3de9b5ef939b83e946dfaf721ed3a3ddaa5 tools/ci/shellcheck_akcji.py:37
rule:
  # Powrót z metadata.przypadki: PLIK_TESTU_PR kończył się r"$" i nie widział linii PONOWIENIE w logu zadania Windows (CRLF),
  # choć #1568 i #1585 naprawiły już CRLF w innych miejscach (R-SYSTEM). Pozostałe przypadki to kod z postaciami, które
  # przepuszczały listy dozwolonych atomów przed $ z #1781 (W1 r1 i W1 r2: atom .* przed $, napis rf; W1 r3: wzorzec
  # sklejony z kilku literałów), więc reguła nie wraca do czytania składni wzorca. Literał z $ na końcu w wywołaniu re.*;
  # postacie, których reguła nie łapie, są próbkami ZNANE_LUKI_REGUL_POWROTOW w tests/test_zapadki.py.
  kind: string
  regex: '[^\\]\$["'']$'
  not:
    regex: '(\\r\?|\\s[*+])\$["'']$'
  inside:
    kind: call
    stopBy: end
    has:
      field: function
      regex: '^re\.(compile|search|match|fullmatch|finditer|findall|sub|subn|split)$'
