id: kotwica-konca-linii
language: python
severity: error
message: >-
  kotwica $ na końcu wzorca re nie pasuje do linii zakończonej \r\n (log zadania Windows z API GitHuba, tekst z bajtów
  bez uniwersalnych końców linii), więc wzorzec po cichu nie widzi linii; w napisie r użyj \r?$ zamiast $ (albo \s*$,
  gdy biały znak na końcu linii jest dozwolony)
files:
  - tools/**/*.py
rule:
  # Powrót #1584 W1 r1: PLIK_TESTU_PR kończył się r"$" i nie widział linii PONOWIENIE w logu zadania Windows (CRLF),
  # choć #1568 i #1585 naprawiły już CRLF w innych miejscach (R-SYSTEM). Literał z $ na końcu w wywołaniu re.*;
  # postacie, których reguła nie łapie, są próbkami ZNANE_LUKI_REGUL_POWROTOW w tests/test_zapadki.py.
  kind: string
  regex: '[^\\]\$["'']$'
  not:
    # Lista dozwolonych: napis r bez | poza ucieczką i klasą, w którym tuż przed $ (i nawiasami zamykającymi bez
    # kwantyfikatora) stoi \r? albo atom z nieograniczoną górną granicą (*, +, {n,}), którego zbiór znaków na pewno
    # zawiera \r: ., \r, \s, klasa z jawnym \r albo \s, klasa zanegowana bez żadnej ucieczki. Taki wzorzec widzi linię
    # CRLF, bo ostatnie powtórzenie bierze \r, a $ pasuje przed końcowym \n. Każda inna postać jest zgłaszana.
    regex: >-
      ^([rR][bBfF]?|[bBfF][rR])("""|'''|"|')([^|\\\[]|\\.|\[([^\]\\]|\\.)*\])*(\\r\?|(\.|\\[rs]|\[\^[^\]\\]+\]|\[(\\[rs]|([^\]\\^]|\\.)([^\]\\]|\\.)*?\\[rs])([^\]\\]|\\.)*\])(\*|\+|\{[0-9]+,\})[?+]?)\)*\$("""|'''|"|')$
  inside:
    kind: call
    stopBy: end
    has:
      field: function
      regex: '^re\.(compile|search|match|fullmatch|finditer|findall|sub|subn|split)$'
