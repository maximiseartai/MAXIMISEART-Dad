id: naglowek-toml-podlancuchem
language: python
severity: error
message: >-
  nagłówek tabeli TOML/INI szukany podłańcuchem tekstu pliku nie widzi [ tool.uv ], klucza kropkowego uv.… pod [tool]
  ani komentarza: czytaj plik tomllib (albo configparser) i pytaj o klucz
files:
  - tools/**/*.py
  - src/**/*.py
  - .agents/skills/*/scripts/**/*.py
metadata:
  przypadki:
    - 2161/W1/r1
rule:
  any:
    - kind: comparison_operator
      all:
        - has:
            field: operators
            regex: '^(not )?in$'
        - has:
            nthChild: 1
            matches: naglowek-tabeli
        - has:
            stopBy: end
            kind: call
            has:
              field: function
              regex: '\.read_text$'
    - kind: call
      all:
        - has:
            field: function
            regex: '\.read_text\([^)]*\)\.(find|rfind|index|rindex|count)$'
        - has:
            field: arguments
            has:
              matches: naglowek-tabeli
utils:
  naglowek-tabeli:
    kind: string
    regex: '(^[rbfRBF]*("""|''''''|"|'')|\\n|\n)[ \t]*\['
