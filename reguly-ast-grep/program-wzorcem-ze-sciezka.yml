id: program-wzorcem-ze-sciezka
language: python
severity: error
message: >-
  program rozpoznawany wzorcem z opcjonalną ścieżką przed nazwą (klasa znaków z *, +, {n,} albo *? i zaraz potem /,
  jak [\w.~/-]*/ albo [\w.-]+/) szukanym w tekście polecenia: re.search cofa się po każdym / (czas kwadratowy w długości
  słowa) i trafia w katalog o nazwie programu (/tmp/python/x.py); rozpoznaj program po słowie: rsplit("/", 1)[-1]
  i porównanie z nazwą albo fullmatch, jak GH_NAMES w _reruns
files:
  - tools/hooks/**/*.py
metadata:
  przypadki:
    - 2295/W1/r3
rule:
  # Klasa znaków bez ^ na początku, z kwantyfikatorem powtórzeń i zaraz potem / (segment ścieżki przed nazwą programu),
  # z / w klasie albo bez: * albo +, a w drugiej postaci leniwy albo liczony ({n,m}).
  kind: string
  any:
    - regex: '\[[^\]^][^\]]*\][*+]/'
    - regex: '\[[^\]^][^\]]*\](?:[*+]\?|\{\d*,\d*\}\??)/'
