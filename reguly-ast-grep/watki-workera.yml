id: watki-workera
language: python
severity: error
message: >-
  wątki procesu workera pytest poza linią testu: zapytaj tests/fixtures/linie_watkow.py (new_line i threads_since o
  wątki, które żyją, started_threads o wątki uruchomione w bloku), bo w workerze żyją też wątki wcześniejszych testów
  i timer pytest-timeout
files:
  - tests/**/*.py
ignores:
  - tests/fixtures/linie_watkow.py
  - tests/test_zakazy_ruff.py
  - tests/test_zapadki.py
metadata:
  przypadki:
    - 0e304aec7661ebd87405895202a851cf5337db3c tests/test_jedno_uruchomienie_naraz.py:56
rule:
  # Wątki procesu workera pytest poza linie_watkow, jak monkeypatch.setattr(threading.Thread, "start", counted)
  # w commicie z metadata.przypadki (#633). W kodzie threading.Thread.start i threading.active_count odrzuca ruff TID251 (tests/ruff.toml),
  # ale nie na linii z # noqa: TID251, nie w napisie i nie pod samą nazwą z from-importu. Reguła czyta tekst węzłów,
  # nie ich rodzaj, więc odstępy i łamanie wokół kropki ani wyrażenie pośrednie nie zmieniają wyniku.
  # threading.enumerate, sys._current_frames, threading._active, klasa wątku w zmiennej i podmiana run albo __init__
  # to znane luki w ZNANE_LUKI_WATKOW w tests/test_zapadki.py.
  any:
    # Wywołanie, którego wyrażenie funkcji kończy się słowem active_count.
    - kind: call
      has:
        field: function
        regex: '\bactive_count$'
    # Atrybut start na wyrażeniu, którego tekst kończy się słowem Thread.
    - kind: attribute
      all:
        - has:
            field: attribute
            regex: '^start$'
        - has:
            field: object
            regex: '\bThread$'
    # Napis "start" (albo 'start') zaraz po przecinku za węzłem dowolnego rodzaju, którego tekst kończy się słowem
    # Thread: sam albo jako początek węzła, który stoi po przecinku (napis sklejany, metoda, operator, indeks).
    - kind: string
      regex: '^["'']start["'']'
      any:
        - follows:
            pattern: ','
            follows:
              regex: '\bThread$'
        - inside:
            stopBy: end
            regex: '^["'']start["'']'
            follows:
              pattern: ','
              follows:
                regex: '\bThread$'
    # Ten sam tekst w komentarzu i napisie, jak linia zapadki.
    - any:
        - kind: comment
        - kind: string
      regex: '\bactive_count\(|\bThread\.start\b|\bThread,\s*["'']start["'']'
