id: zwolnienie-wezlow-po-nazwie-celu
language: python
severity: error
message: >-
  zbiór zwolnionych węzłów (id(...) w wyrażeniu zbioru albo w set() i frozenset() z generatora), które czyta nazwę celu
  przypisania (.targets, .target przy ast.Assign albo ast.AnnAssign), a w warunku if ma nazwę wpisaną w kod (["OPIS"],
  STALE_PROZY): wyjątek dla jednej stałej zwalnia każde przypisanie tej nazwy w każdym module i na każdej głębokości;
  zwalniaj tekst przez jego właściciela (kod, który go czyta), nie przez nazwę zmiennej
files:
  - tests/**/*.py
  - tools/**/*.py
  - .agents/**/*.py
metadata:
  przypadki:
    - 2261/W1/r1
    - 2261/W2/r1
rule:
  # Zbiór id(...) z wyrażenia zbioru albo z generatora w set()/frozenset(), które czyta nazwę celu przypisania (.targets,
  # a .target przy ast.Assign albo ast.AnnAssign), także w zagnieżdżonym for, a któryś jego warunek (if) ma nazwę
  # wpisaną w kod (napis albo stała WIELKIMI LITERAMI).
  any:
    - kind: set_comprehension
    - kind: generator_expression
      inside:
        kind: call
        has:
          field: function
          regex: '^(frozen)?set$'
  all:
    - has:
        field: body
        pattern: id($X)
    - has:
        kind: if_clause
        has:
          stopBy: end
          matches: nazwa-wpisana
    - any:
        - has:
            stopBy: end
            kind: attribute
            regex: '\.targets(\[[^\]]*\])?(\.id)?$'
        - all:
            - has:
                stopBy: end
                kind: attribute
                regex: '\.target(\.id)?$'
            - has:
                stopBy: end
                kind: attribute
                regex: '^ast\.(Ann)?Assign$'
utils:
  nazwa-wpisana:
    any:
      - kind: string
      - kind: identifier
        regex: '^[A-Z][A-Z0-9_]+$'
