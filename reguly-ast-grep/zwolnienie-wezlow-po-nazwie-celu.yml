id: zwolnienie-wezlow-po-nazwie-celu
language: python
severity: error
message: >-
  zbiór zwolnionych węzłów (id(węzeł), id(węzeł.value)) wybrany po nazwie celu przypisania porównanej z nazwą
  wpisaną w kod (["OPIS"], STALE_PROZY): wyjątek dla jednej stałej zwalnia każde przypisanie tej nazwy w każdym module
  i na każdej głębokości; zwalniaj tekst przez jego właściciela (kod, który go czyta), nie przez nazwę zmiennej
files:
  - tests/**/*.py
  - tools/**/*.py
  - .agents/**/*.py
metadata:
  przypadki:
    - 2261/W1/r1
    - 2261/W2/r1
rule:
  kind: set_comprehension
  all:
    - has:
        field: body
        pattern: id($X)
    - has:
        stopBy: end
        kind: comparison_operator
        all:
          - has:
              stopBy: end
              kind: attribute
              regex: '\.(targets?|id)$'
          - has:
              stopBy: end
              any:
                - kind: string
                - kind: identifier
                  regex: '^[A-Z][A-Z0-9_]+$'
