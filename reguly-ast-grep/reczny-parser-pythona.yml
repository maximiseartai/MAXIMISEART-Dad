id: reczny-parser-pythona
language: python
severity: error
message: >-
  ręczny parser Pythona (ast.parse, ast.walk, tokenize) w pliku spoza listy plików, którym wolno parsować: nazwij korzeń
  poprawki i napraw go na najwyższym szczeblu z sekcji „Korzeń i chwast” skilla .agents/skills/przeglad/SKILL.md (jedna
  droga, typ albo reguła ruff, test zachowania, reguła deklaratywna); plik, który mimo to parsuje, dopisz do ignores:
  tej reguły z powodem w opisie PR
files:
  - tests/**/*.py
  - tools/**/*.py
  - .agents/skills/**/*.py
# Pliki, którym wolno parsować Pythona ręcznie (stan z 12.11.2026); lista maleje z każdym usuniętym plikiem, a każda
# ścieżka bez wzorca istnieje (test_kazda_konkretna_sciezka_w_ignores_reguly_ast_grep_istnieje).
ignores:
  - .agents/skills/verify-centrum-rozliczen/scripts/centrum_self_test.py
  - tests/fixtures/skladnia.py
  - tests/test_decyzje_na_faktach.py
  - tests/test_eksplorator_w_procesie.py
  - tests/test_granice_importow.py
  - tests/test_granice_wyjatkow.py
  - tests/test_jeden_odczyt_skoroszytu.py
  - tests/test_jeden_zapis_skoroszytu.py
  - tests/test_komunikaty_expect.py
  - tests/test_limit_drive_centrum.py
  - tests/test_mapy_funkcji.py
  - tests/test_potomne.py
  - tests/test_rodzaj_zatrzymania.py
  - tests/test_skrypty_bez_instalacji.py
  - tests/test_spis_narzedzi.py
  - tests/test_struktura_testow.py
  - tests/test_tabela_zatrzyman_efenix.py
  - tests/test_wywolanie_skryptow_skilli.py
  - tests/test_zapadki.py
  - tools/lib/komunikat_mapy.py
  - tools/lib/kroki_skilli.py
  - tools/lib/niestabilne_testy.py
  - tools/lib/rozjazd_modelu.py
  - tools/lib/wplyw_zmiany.py
  - tools/mutacje_zmiany.py
  - tools/rownowaznosc.py
rule:
  # Ręczny parser Pythona: wywołanie ast.parse albo ast.walk, atrybut na nazwie tokenize i ten sam tekst w komentarzu
  # albo napisie. Reguła biegnie na całym drzewie (REGULY_CALEGO_DRZEWA w tests/test_zapadki.py), a nie tylko na
  # liniach dodanych, bo plik z listy przeniesiony pod nową nazwę (git mv) nie ma linii dodanych. from ast import parse,
  # import ast pod aliasem, from tokenize import, ast.NodeVisitor, compile z ast.PyCF_ONLY_AST, kropka w następnej
  # linii i pomocnik, który parsuje za wywołującego, to znane luki w ZNANE_LUKI_PARSERA w tests/test_zapadki.py.
  any:
    - kind: call
      has:
        field: function
        regex: '^ast\.(parse|walk)$'
    - kind: attribute
      has:
        field: object
        regex: '^tokenize$'
    - any:
        - kind: comment
        - kind: string
      regex: '[^\w.](ast\.(parse|walk)\(|tokenize\.)'
