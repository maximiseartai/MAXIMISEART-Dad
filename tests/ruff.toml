# Wątki procesu workera pytest bez linii testu: worker trzyma też wątki wcześniejszych testów i timer pytest-timeout
# (#633, czerwony main w 0e304aec7). Formę w napisie, np. setattr(threading.Thread, "start", …), łapie zapadka
# test_watki_testu_tylko_przez_linie_watkow w tests/test_zapadki.py.
"threading.Thread.start".msg = "o wątki testu pytaj tests/fixtures/linie_watkow.py (new_line i threads_since o wątki, które żyją, started_threads o wątki uruchomione w bloku)"
"threading.active_count".msg = "o wątki testu pytaj tests/fixtures/linie_watkow.py (new_line i threads_since o wątki, które żyją, started_threads o wątki uruchomione w bloku)"
# Druga wstawka katalogu narzędzi w module testu tylko powtarza conftest i kusi, żeby fixture re-eksportował narzędzie
# (#1181).
"sys.path".msg = "tests/conftest.py kładzie src, tools, tools/lib i tools/ci na sys.path każdego testu: importuj moduł wprost (import potomne)"
