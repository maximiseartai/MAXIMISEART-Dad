# Ruff bierze banned-api z najbliższego pliku konfiguracji w całości, a nie dokłada do tabeli rodzica: pierwsze wpisy
# to kopia tabeli z pyproject.toml (tests/test_zakazy_ruff.py pilnuje, że żadnego nie gubi), a ostatnie obowiązują tylko
# w tests/, każdy z próbką w tests/test_zakazy_ruff.py. Prawo właściciela stoi w per-file-ignores pyproject.toml.
extend = "../pyproject.toml"

[lint.flake8-tidy-imports.banned-api]
"os.name".msg = 'sprawdzaj system przez sys.platform == "win32": mypy zawęża gałęzie tylko po sys.platform'
"typing.no_type_check".msg = "nie wyłączaj mypy dla całej funkcji: popraw typy albo stłum jedną linię przez # type: ignore[kod] z powodem, które liczy tests/test_granice_wyjatkow.py"
"typing_extensions.no_type_check".msg = "nie wyłączaj mypy dla całej funkcji: popraw typy albo stłum jedną linię przez # type: ignore[kod] z powodem, które liczy tests/test_granice_wyjatkow.py"
"rozliczenia.centrum.refusal._CATALOG".msg = "odmowę API Centrum daje fabryka z rozliczenia.centrum.refusal (np. unexpected_failure); nową dopisz tam z próbką w tests/expected/komunikaty.txt"
