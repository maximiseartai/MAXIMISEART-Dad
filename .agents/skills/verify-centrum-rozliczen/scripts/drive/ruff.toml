# Deleting, moving or replacing a file or folder fails on Windows while the server holds it open (WinError 32, #921);
# the retrying helpers of drive/common.py wait it out. Forms ruff cannot resolve (a method on an instance, p.unlink())
# are the guard _removals of centrum_self_test.py.
"os.remove".msg = "delete a file of the run with remove of drive/common.py, which retries while the server holds it open (#921)"
"os.unlink".msg = "delete a file of the run with remove of drive/common.py, which retries while the server holds it open (#921)"
"os.rmdir".msg = "delete an empty folder of the run with remove_empty_folder of drive/common.py, which retries while the server looks into it (#921)"
