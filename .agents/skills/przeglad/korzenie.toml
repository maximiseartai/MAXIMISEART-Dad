# Zamknięta lista kodów korzeni (ADR 0031, skill przeglad, sekcja „Korzeń i chwast”).
# Korzeń to to, co skłoniło agenta do błędu, a nie sam błąd.
# Każdy kod ma jedno zdanie opisu i numer jednego PR, w którym przegląd znalazł Ważne z tym korzeniem.
# Nowy kod dopisuje autor PR, gdy werdykt podał „Korzeń: NOWY R-KOD - opis” z kodem spoza listy; tools/scal_pr.py --werdykt czyta ten plik.

[R-DRUGA-DROGA]
opis = "Druga droga do tego, co ma już właściciela: własny predykat, pamięć podręczna albo wyrocznia obok wspólnej, albo bezpośrednie wywołanie obok modułu-właściciela, bo był najbliższym przykładem."
przyklad = 1274

[R-BEZ-WLASCICIELA]
opis = "Decyzja (kolejność zapisów stanu, rodzaj awarii) rozproszona po wielu miejscach bez jednego właściciela, więc każdy PR dokłada miejsce według najbliższego przykładu."
przyklad = 1166

[R-MATCH-KOD]
opis = "Własny strażnik AST albo regex na kodzie wylicza postacie z najbliższego przykładu, zamiast zakazu w ruff, typu albo audytu w czasie działania."
przyklad = 1363

[R-MATCH-TEKST]
opis = "Własny parser formatu, który ma prawdziwy parser albo renderer (Markdown GitHuba, Bash, YAML, HTML, XML, git blame)."
przyklad = 1196

[R-KONSTRUKCJA]
opis = "Reguła „tylko X tworzy Y” pilnowana testem na tekście kodu zamiast typem, więc replace, cast, podklasa albo __new__ ją omija."
przyklad = 1371

[R-LISTA-KOPIA]
opis = "Lista, liczba albo tekst przepisany ręcznie ze źródła w innym pliku (katalogi, pola, Komunikaty, ścieżki, skrót commitu), więc rozjeżdża się ze źródłem."
przyklad = 1223

[R-PROZA-KOPIA]
opis = "Ta sama reguła żyje w kilku dokumentach (ADR, skill, docs/agents), więc zmiana jednej kopii przeczy drugiej."
przyklad = 704

[R-WYCIEK]
opis = "Ochrona danych taty wylicza zakazane wartości albo zgaduje ich położenie z treści, zamiast przepuszczać tylko dozwolone."
przyklad = 984

[R-WORKER]
opis = "Testy i eksploratory biegną w procesie workera pytest i dzielą jego wątki, blokady i kolejność z sąsiadami."
przyklad = 1072

[R-SYSTEM]
opis = "Agent pracuje na macOS, a zachowanie zależy od systemu albo wersji Pythona (Windows, Linux nocy, CRLF, 3.11, 3.14)."
