# Dwie szopy (ADR 0034): wyjątki od reguły katalogu `REGULY` w `tools/ci/rozmiar_pr.py`, z której `src/` i `tests/`
# to produkt, `tools/` maszyneria procesu, skille `verify-*` weryfikacja produktu, a pozostałe skille maszyneria.
# Klucz to jednostka (plik albo katalog z `/` na końcu), a wartość to jej pliki testów. Plik bez wpisu ma grupę
# z reguły, więc wpis dostaje jednostka innej grupy niż jej katalog i jednostka szopy, która ma pliki testów.
# Podtabela `przepuszcza` grupy: jednostki, których fałszywe „OK” przepuszcza zły kod produktu (#1623, #1624); noc mutuje
# ich pliki `.py` w `tools/` jak `src/`, a reszty `tools/` nie (ADR 0021).

