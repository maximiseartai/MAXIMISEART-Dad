  - {id: gateway, zapisy: [gateway, zyxel], grupa: router}
  - {id: fut, zapisy: [fut], grupa: tv}
  - {id: globo, zapisy: [globo], grupa: tv}
  - {id: stb2, zapisy: [stb2], grupa: tv}
  - {id: wifi6extra, zapisy: [wifi6extra], grupa: extender}
  - {id: usterka, zapisy: [usterka, usterka hurt, usterka wew]}
  - {id: gniazdo, zapisy: [gniazdo]}
  - {id: zmiana-instalacji, zapisy: [zmiana instalacji w lokalu abonenta]}
  - {id: instalacja-reczna, zapisy: [instalacja ręczna, wizja]}
