# Legenda czynności z Wydania (ADR 0038): mail taty z 15.11.2026 i zapis instmdic przy instmdik. Do odpowiedzi taty
# rt2 daje AM, liczba w bypas i instwew nie ma znaczenia, a pz działa tylko jako pz20m. Ten sam format ma plik
# config/legenda-czynnosci.yaml taty (activity_legend_file).
schema_version: 1
kody:
  - {id: inst, zapisy: ["inst{n}m"], kolumna: Y}
  - {id: instmdik, zapisy: [instmdik, instmdic], kolumna: Y}
  - id: instutp
    zapisy: ["instutp{n}m"]
    przedzialy: [{od: 1, do: 15, kolumna: AL}, {od: 16, do: 30, kolumna: AJ}]
  - id: instwewrg6
    zapisy: ["instwewrg6{n}m"]
    przedzialy: [{od: 1, do: 10, kolumna: AK}, {od: 11, do: 15, kolumna: AL}, {od: 16, do: 30, kolumna: AJ}]
  - {id: instwew, zapisy: ["instwew{n}m"], wypelnienia: [{kolumna: AF, kolor: zielony}]}
  - {id: rt2, zapisy: [rt2], kolumna: AM, wypelnienia: [{kolumna: AM, kolor: czerwony}, {kolumna: AF, kolor: zielony}]}
  - {id: bypas, zapisy: ["bypas{n}m"], kolumna: AM}
  - {id: spawgnd, zapisy: [spawgnd], kolumna: AD}
  - {id: spawpg, zapisy: [spawpg], kolumna: AB, kwota: 70, wypelnienia: [{kolumna: AS, kolor: czerwony}]}
  - {id: spawez, zapisy: [spawez], kolumna: AB}
  - {id: spawmufakan, zapisy: [spawmufakan], kolumna: AB, kwota: 70}
  - {id: spawmufaziem, zapisy: [spawmufaziem], kolumna: AC}
  - {id: dzielnik1/2, zapisy: [dzielnik1/2, dzielnika1/2], kwota: 50}
  - {id: pz20m, zapisy: [pz20m], kwota: 480}
