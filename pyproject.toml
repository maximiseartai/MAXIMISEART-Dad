[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maximiseart-dad-settlements"
version = "0.1.0"
description = "Lokalne, deterministyczne rozdzielanie rozliczenia zbiorczego na pliki pracowników."
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "PyYAML>=6.0",
    "fastapi>=0.146",
    # Wycena w efenix prowadzi okno przeglądarki taty (spec #741); Aktualizacja narzędzia instaluje requirements.txt.
    # Playwright 1.65 uruchamia okno efenix bez --disable-features, więc zostajemy na 1.64.x do decyzji w #1242.
    "playwright>=1.64,<1.65",
    "uvicorn>=0.54",
]

[project.optional-dependencies]
dev = [
    # Reguły ast-grep z sgconfig.yml: na dodanych liniach repozytorium, a reguły REGULY_CALEGO_DRZEWA na każdej linii
    # swoich plików
    # (tests/test_zapadki.py, ADR 0034).
    "ast-grep-cli==0.51.0",
    "fastapi==0.146.0",
    # explore_runs.py of verify-jedno-uruchomienie-naraz runs its modelled threads as greenlets (#565).
    "greenlet==3.5.6",
    # Graf importów kontraktów .importlinter (tests/test_granice_importow.py); od grimp zależy, które importy graf widzi.
    "grimp==3.20",
    "httpx2==2.14.0",
    "hypothesis==6.170.5",
    "import-linter==2.16",
    "mypy==2.0.0",
    "playwright==1.64.0",
    "pydantic==2.14.1",
    "pytest==8.3.3",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "ruff==0.15.12",
    "types-openpyxl==3.1.5.20260827",
    "types-PyYAML==6.0.12.20260906",
    # The drive of verify-centrum-rozliczen shows dates in Dad's time zone; Python on Windows has no zone database.
    "tzdata==2026.5; sys_platform == 'win32'",
    "uvicorn==0.54.0",
]
# Linters of .github/ for CI job frontend and tools/ci_lokalnie.py; apart from dev, so other jobs do not install them.
workflowy = [
    "actionlint-py==1.7.12.25",
    "shellcheck-py==0.11.0.1",
    "zizmor==1.32.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Z -n wolny worker zabiera testy z kolejki zajętego. Przy domyślnym --dist load kolejka workera z długim testem
# (kopia Wzorca, ~65 s) czeka na niego, a inne workery już stoją: pełny pytest -n 4 trwa wtedy ~1,5 raza dłużej.
addopts = ["--strict-config", "--dist", "worksteal"]
# Najwolniejszy test trwa kilka sekund; zawieszony test kończy się błędem zamiast blokować przebieg.
timeout = 120
# Test, który wisi dłużej, zostawia w logu stosy wszystkich wątków swojego procesu, także gdy błąd pytest-timeout go nie
# zakończył (w #699 czekał przy wyjściu z klienta testowego na wątek serwera na prawdziwej blokadzie); zadanie kończy
# potem limit kroku pytest z planu runu (tools/lib/plan_runu.py).
faulthandler_timeout = 150
markers = ["dlugi: test trwa kilka razy dłużej niż inne; xdist zaczyna od niego kawałek listy workera"]
# Junit z --junitxml (zadania pytest w CI) ma plik każdego testu, z którego tools/ci/zapis_czasow.py liczy czas pliku.
junit_family = "xunit1"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rozliczenia.centrum" = ["static/**/*", "*.ico"]

[tool.mypy]
# API biblioteki standardowej sprawdzane dla najstarszego Pythona z requires-python, nie dla tego, którym biegnie mypy.
python_version = "3.13"
strict = true
files = [
    "*.py",
    "src",
    "tests",
    "tools",
    "tools/hooks/pre-push",
    ".agents/skills/*/scripts",
]
mypy_path = "src"
show_error_codes = true
# Ponad strict: match bez przypadku dla każdego wariantu, warunek zawsze prawdziwy i ignore bez kodu błędu.
enable_error_code = ["exhaustive-match", "truthy-bool", "truthy-iterable", "ignore-without-code"]

# Kod martwy dla mypy w src/: gałąź isinstance(x, Unreadable) przy wartości bez unii (literał w miejscu pliku
# Ustawień bez odczytu u wołającego, który odmawia, #2029 r1 W1). Poza src/ zostaje wyłączony: testy, narzędzia i skrypty
# skilli mają 37 miejsc z gałęzią innej platformy po wczesnym return i yield po raise.
[[tool.mypy.overrides]]
module = ["rozliczenia", "rozliczenia.*"]
warn_unreachable = true
