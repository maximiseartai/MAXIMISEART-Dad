[tool.mypy]
# API biblioteki standardowej sprawdzane dla najstarszego Pythona z requires-python, nie dla tego, którym biegnie mypy.
python_version = "3.13"
strict = true
files = [
    "*.py",
    "src",
    "tests",
    "tools",
    "tools/hooks/pre-push",
    ".agents/skills/*/scripts",
]
mypy_path = "src"
show_error_codes = true
# Ponad strict: match bez przypadku dla każdego wariantu, warunek zawsze prawdziwy i ignore bez kodu błędu.
enable_error_code = ["exhaustive-match", "truthy-bool", "truthy-iterable", "ignore-without-code"]
