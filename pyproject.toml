[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maximiseart-dad-settlements"
version = "0.1.0"
description = "Lokalne, deterministyczne rozdzielanie rozliczenia zbiorczego na pliki pracowników."
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "PyYAML>=6.0",
    "fastapi>=0.146",
    # Wycena w efenix prowadzi okno przeglądarki taty (spec #741); Aktualizacja narzędzia instaluje requirements.txt.
    # Playwright 1.65 uruchamia okno efenix bez --disable-features, więc zostajemy na 1.64.x do decyzji w #1242.
    "playwright>=1.64,<1.65",
    "uvicorn>=0.54",
]

[project.optional-dependencies]
dev = [
    # Reguły ast-grep z sgconfig.yml na dodanych liniach repozytorium (tests/test_zapadki.py, ADR 0034).
    "ast-grep-cli==0.51.0",
    "fastapi==0.146.0",
    # explore_runs.py of verify-jedno-uruchomienie-naraz runs its modelled threads as greenlets (#565).
    "greenlet==3.5.6",
    # Graf importów kontraktów .importlinter (tests/test_granice_importow.py); od grimp zależy, które importy graf widzi.
    "grimp==3.20",
    "httpx2==2.14.0",
    "hypothesis==6.170.5",
    "import-linter==2.16",
    "mypy==2.0.0",
    "playwright==1.64.0",
    "pydantic==2.14.1",
    "pytest==8.3.3",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "ruff==0.15.12",
    "types-openpyxl==3.1.5.20260827",
    "types-PyYAML==6.0.12.20260906",
    # The drive of verify-centrum-rozliczen shows dates in Dad's time zone; Python on Windows has no zone database.
    "tzdata==2026.5; sys_platform == 'win32'",
    "uvicorn==0.54.0",
]
# Linters of .github/ for CI job ruff-mypy and tools/ci_lokalnie.py; apart from dev, so other jobs do not install them.
workflowy = [
    "actionlint-py==1.7.12.25",
    "shellcheck-py==0.11.0.1",
    "zizmor==1.32.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Z -n wolny worker zabiera testy z kolejki zajętego. Przy domyślnym --dist load kolejka workera z długim testem
# (kopia Wzorca, ~65 s) czeka na niego, a inne workery już stoją: pełny pytest -n 4 trwa wtedy ~1,5 raza dłużej.
addopts = ["--strict-config", "--dist", "worksteal"]
# Najwolniejszy test trwa kilka sekund; zawieszony test kończy się błędem zamiast blokować przebieg.
timeout = 120
# Test, który wisi dłużej, zostawia w logu stosy wszystkich wątków swojego procesu, także gdy błąd pytest-timeout go nie
# zakończył (w #699 czekał przy wyjściu z klienta testowego na wątek serwera na prawdziwej blokadzie); zadanie kończy
# potem limit kroku pytest z planu runu (tools/lib/plan_runu.py).
faulthandler_timeout = 150
markers = ["dlugi: test trwa kilka razy dłużej niż inne; xdist zaczyna od niego kawałek listy workera"]
# Junit z --junitxml (zadania pytest w CI) ma plik każdego testu, z którego tools/ci/zapis_czasow.py liczy czas pliku.
junit_family = "xunit1"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rozliczenia.centrum" = ["static/**/*", "*.ico"]

[tool.ruff]
target-version = "py313"
include = [
    "/*.py",
    "src/**/*.py",
    "tests/**/*.py",
    "tools/**/*.py",
    "tools/hooks/pre-push",
    ".agents/skills/*/scripts/**/*.py",
]
extend-exclude = [".claude"]

[tool.ruff.per-file-target-version]
# Systemowy Python (na Macu 3.9) uruchamia je przed .venv: bramę pre-push, hooki czekania, zgody i pracy w tle Claude Code
# i setup_worktree razem z potomne i repo, które importują. tests/test_systemowy_python.py importuje je tym Pythonem,
# gdy jest, i łapie też API.
"tools/hooks/pre-push" = "py39"
"tools/hooks/czekanie.py" = "py39"
"tools/hooks/zgoda.py" = "py39"
"tools/hooks/praca_w_tle.py" = "py39"
"tools/setup_worktree.py" = "py39"
"tools/lib/potomne.py" = "py39"
"tools/lib/repo.py" = "py39"
"tools/lib/ostatnie_linie.py" = "py39"

[tool.ruff.lint]
extend-select = [
    # Szeroki except tylko z wpisem do dziennika albo ponownym rzuceniem.
    "BLE001",
    "S110",
    "TID251",
    # Martwe tłumienie to wzór do skopiowania. N802 ożywia cztery noqa z powodem (nazwy jak w threading i tempfile).
    "RUF100",
    # Kod noqa spoza ruff (np. PR1614, sam albo obok prawdziwego) to proza w kształcie kodu, a komentarz-w-src z
    # reguly-ast-grep/ przepuszcza każdy kod [A-Z]+[0-9]+.
    "RUF102",
    "N802",
    # Zapadki: przy włączeniu 0 naruszeń, więc wzorzec nie wróci ani się nie rozleje. Tłumienie tylko z kodem,
    # bez TODO i zakomentowanego kodu, bez exec/eval, breakpoint() i yaml.load, bez pułapek wartości domyślnych i pętli.
    "PGH003",
    "PGH004",
    "ERA001",
    "FIX001",
    "FIX002",
    "FIX003",
    "FIX004",
    "B006",
    "B008",
    "B018",
    "B904",
    "RUF012",
    "RUF013",
    "S102",
    "S307",
    "S506",
    "T100",
    "PLW2901",
    # zip bez strict ucina dłuższą listę po cichu, więc porównanie wierszy w weryfikatorze może przejść przy brakującym
    # wierszu: strict=True, gdy długości muszą być równe, strict=False tylko z powodem, a kolejne pary przez pairwise.
    "B905",
    "RUF007",
    # subprocess.run bez check połyka błąd polecenia: check=True, chyba że kod potem czyta returncode.
    "PLW1510",
    # Kod taty bez Any w sygnaturach i bez print (zakres w per-file-ignores): sygnatura w src/ nazywa typ konkretny,
    # object albo TypeVar, a problem trafia do taty Komunikatem, bo konsoli tata nie widzi (drukują tylko konsole startu
    # Centrum i skrótu z per-file-ignores).
    "ANN401",
    "T201",
    # Dzień i chwila jawnie ze strefą: date.today() i datetime.now() biorą po cichu strefę komputera, a dzień okresu
    # i termin wyjątku zależą od tego, czyja to północ. DTZ001 (datetime(...) bez tzinfo, 146 stałych) jest poza zakresem.
    "DTZ002",
    "DTZ003",
    "DTZ004",
    "DTZ005",
    "DTZ006",
    "DTZ007",
    "DTZ011",
    "DTZ012",
    # pytest.raises(ValueError) przechodzi na każdym ValueError, także z innej linii niż ta, którą test sprawdza.
    "PT011",
    "PT012",
    # Zapadki z reguł, które przy włączeniu miały 1-4 naruszenia: pierwszeństwo and/or w nawiasach, suppress zamiast
    # except-pass, typy z collections.abc, next() zamiast [..][0] i Path zamiast os.chmod, os.stat, os.listdir.
    "RUF021",
    "SIM105",
    "UP035",
    "RUF015",
    "PTH101",
    "PTH116",
    "PTH208",
]

[tool.ruff.lint.per-file-ignores]
"!src/**" = ["ANN401", "T201"]
# Konsola startu Centrum i instalatora skrótu.
"src/rozliczenia/centrum/launcher.py" = ["T201"]
"src/rozliczenia/centrum/shortcut.py" = ["T201"]
# Szeroki except w Centrum kończy się unexpected_failure dziennika Centrum albo ponownym rzuceniem; pilnuje tego
# tests/test_granice_wyjatkow.py zamiast noqa z tym samym powodem w każdej kopii.
"src/rozliczenia/centrum/**" = ["BLE001"]
# Prawo właściciela: moduł, któremu komunikat zakazu banned-api kieruje resztę kodu, używa zakazanej nazwy bez noqa.
# Ruff zwalnia plik z całego TID251, więc tests/test_zakazy_ruff.py (OWNERS) trzyma, które nazwy wolno mu użyć.
"src/rozliczenia/wall_clock.py" = ["TID251"]
"src/rozliczenia/centrum/catalog.py" = ["TID251"]
"src/rozliczenia/dad_files.py" = ["TID251"]
"src/rozliczenia/register_file.py" = ["TID251"]
"src/rozliczenia/template_file.py" = ["TID251"]
"src/rozliczenia/centrum/{app,case_delivery,comment_versions,dad_notes,outbox,quantity_check_run,reports,run_logs_guard}.py" = ["TID251"]
"src/rozliczenia/centrum/opener.py" = ["TID251"]
"tools/lib/import_dynamiczny.py" = ["TID251"]
"tests/conftest.py" = ["TID251"]
"tests/fixtures/linie_watkow.py" = ["TID251"]
".agents/skills/verify-centrum-rozliczen/scripts/drive/common.py" = ["TID251"]
".agents/skills/verify-centrum-rozliczen/scripts/drive/waiting.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Mypy w CI sprawdza kod dla Windows i dla macOS/Linuksa, ale gałąź pod os.name widzi na obu, więc
# odrzuca w niej API drugiego systemu (os.killpg, signal.SIGKILL w f7a2261 i d0008d3).
