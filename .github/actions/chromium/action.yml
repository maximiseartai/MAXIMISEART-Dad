name: Chromium dla Playwright
description: >-
  Headless shell Chromium dla wersji Playwright zadania, z cache wspólnym dla zadań o tej samej wersji. Zadania pytest,
  Mutation checks i nocne części, które prowadzą przeglądarkę (Atrapa efenix, napęd Centrum), biorą go stąd.
inputs:
  playwright:
    description: >-
      'true' instaluje najpierw Playwright i tzdata (strefa taty na Windows) przypięte w dodatku dev pyproject.toml, dla
      zadania bez dodatku dev; skrypty skilli dodają src do sys.path same, więc pakiet nie musi być zainstalowany.
    default: 'false'
  python:
    description: Python zadania (python-path z actions/setup-python), do którego uv instaluje Playwright.
    default: ''
runs:
  using: composite
  steps:
    - name: Install Playwright
      if: ${{ inputs.playwright == 'true' }}
      shell: bash
      env:
        PYTHON: ${{ inputs.python }}
      run: |
        read -ra packages <<< "$(python -c "import tomllib; dev = tomllib.load(open('pyproject.toml', 'rb'))['project']['optional-dependencies']['dev']; print(' '.join(p.replace(' ', '') for p in dev if p.startswith(('playwright==', 'tzdata=='))))")"
        uv pip install --system --python "$PYTHON" "${packages[@]}"

    - name: Playwright version
      id: playwright
      shell: bash
      run: python -c "from importlib.metadata import version; print('version=' + version('playwright'))" >> "$GITHUB_OUTPUT"

    # One playwright version always downloads the same browser, so the jobs share it; on a hit the install below finds
    # it in place. Headless Chromium runs the headless shell alone, a third of the full browser's size.
    - name: Cache Chromium
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.os == 'Windows' && '~\AppData\Local\ms-playwright' || '~/.cache/ms-playwright' }}
        key: chromium-headless-shell-${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

    # Linux also needs the system libraries of the headless shell, which the cache does not hold.
    - name: Install Chromium
      shell: bash
      run: python -m playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} --only-shell chromium
