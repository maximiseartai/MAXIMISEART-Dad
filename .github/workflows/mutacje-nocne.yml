name: Mutacje nocne

# Once a day, one mutation per line of src/ and of the przepuszcza units of tools/lib/szopa.toml in tools/ (not the skill
# scripts in .agents/skills/, even when marked przepuszcza) that changed on main since the last successful night, as
# tools/mutacje_zmiany.py mutates it, and the mutation scripts of the skills whose folder changed since then. A night
# mutates at most CZESCI_NA_NOC parts of NA_CZESC mutations (tools/mutacje_nocne.py): with more, it stops at a commit
# of main, and the next night starts there. Each surviving mutation, and each mutation its
# part's time limit left without a verdict, goes to the issue "Przeżyte mutacje z #N" of the PR that last changed its
# line, for at most ISSUES_NA_NOC pull requests a night, the rest only to the filing's log, and each failed
# mutation script to "Przeżyte mutacje skilli z #N" of the PR that last changed its skill (tools/mutacje_nocne.py,
# ADR 0021). The parts do not run their own coverage pass: the shards of the job pokrycie run it once for the whole
# night, and each part reads their records. A red night does not move the base, so the next night gets its range again,
# but without the mutations whose verdict from its parts needs no issue (caught, dominated, excused or of the other
# system): the plan reads their identities from the part records of the red runs with the same base, and the shards and
# parts skip the same identities (artifact osadzone-nocy), so the night takes only what no part judged and reaches
# further. Surviving mutations run again, because only the keys in the issues say whether one was filed. Pull requests neither run nor wait for it. The night
# starts from the first push to main after 01:30 UTC (mutacje-nocne-start.yml dispatches it with start: auto), and the
# cron run that comes hours late does no second night. The job odczyt then writes the night's reading to the run summary
# and to the one issue with the label noc-mutacji.
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      od:
        description: 'Mutate the changes since this commit (default: where the last successful run stopped, or 24 h back)'
        required: false
        default: ''
      start:
        description: 'auto: dispatched by mutacje-nocne-start.yml, so the run does no work when the night already ran today (empty for a manual run)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # Two runs at once would file the same surviving mutations; a later run waits.
  group: mutacje-nocne
  cancel-in-progress: false

jobs:
  plan:
    name: Plan mutacji nocnych
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The base is the head commit of the last successful run of this workflow.
      actions: read
    outputs:
      baza: ${{ steps.plan.outputs.baza }}
      do: ${{ steps.plan.outputs.do }}
      czesci: ${{ steps.plan.outputs.czesci }}
      liczba: ${{ steps.plan.outputs.liczba }}
      pokrycie: ${{ steps.plan.outputs.pokrycie }}
      # A run that does no second night skips the skill planner, and its jobs get no matrix.
      skille: ${{ steps.skille.outputs.mutations || '[]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Standard library only, so the runner's python3 runs it as is. The test times of main order the parts, and the
      # skill planner below reads the same download.
      - name: Find the base and split its mutations into parts
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          OD: ${{ inputs.od }}
          ZDARZENIE: ${{ github.event_name }}
          START: ${{ inputs.start }}
        run: python3 tools/mutacje_nocne.py plan --od "$OD" --zdarzenie "$ZDARZENIE" --start "$START" --zakres .ci-plan/zakres.json --osadzone .ci-plan/osadzone.json --czasy .ci-plan/czasy

      # The next night reads "do" from the last successful run's artifact: its base, so the backlog is not skipped. A
      # night after a red one with the same base reads "baza" from it to take the judged mutations of the red run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zakres-nocy
          path: .ci-plan/zakres.json
          retention-days: 90
          include-hidden-files: true
          overwrite: true

      # The identities of the mutations the red runs with the same base judged: the coverage shards and the parts skip them
      # as the plan did, so all three split the same list.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osadzone-nocy
          path: .ci-plan/osadzone.json
          retention-days: 1
          include-hidden-files: true
          overwrite: true

      # The same planner as Mutation checks in ci.yml: the scripts whose verdict the changes since the base can alter,
      # packed into jobs by their times on main.
      - name: Plan the mutation scripts of the skills changed since the base
        id: skille
        if: ${{ steps.plan.outputs.pominieta != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BAZA: ${{ steps.plan.outputs.baza }}
        run: python3 tools/plan_ci.py plan --zdarzenie noc --baza "$BAZA" --czasy .ci-plan/czasy --wyjscie .ci-plan/plan.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.plan.outputs.pominieta != 'true' }}
        with:
          name: plan-skilli
          path: .ci-plan/plan.json
          retention-days: 30
          include-hidden-files: true
          overwrite: true

  # The coverage pass of the parts, once a night: each shard runs its share of the test files touched by the night's
  # files with all changed lines of the night (tools/mutacje_zmiany.py --pokrycie-czesc), and the parts read the
  # records instead of running it themselves. In night 43692461864 the 38 parts ran 157 distinct test files 3028 times
  # in their coverage passes (8.6 runner-hours). The plan gives at most CZESCI_POKRYCIA shards (tools/mutacje_nocne.py).
  pokrycie:
    name: Pokrycie nocy (${{ matrix.czesc }}/${{ strategy.job-total }})
    needs: plan
    if: ${{ needs.plan.outputs.czesci != '[]' && needs.plan.outputs.pokrycie != '[]' }}
    runs-on: ubuntu-latest
    # The shard writes its record within --limit-czesci-s, with its test files counted as failed after the limit.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Before the parts start, so with the 3 skill jobs the night takes at most 7 jobs at once in this phase.
      max-parallel: 4
      matrix:
        # Each entry is a shard number and przegladarka: some of its test files reach Atrapa efenix.
        include: ${{ fromJSON(needs.plan.outputs.pokrycie) }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv pip install --system --python "${{ steps.python.outputs.python-path }}" -e ".[dev]"

      - name: Chromium
        if: ${{ matrix.przegladarka }}
        uses: ./.github/actions/chromium

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: osadzone-nocy
          path: .ci-plan

      # A test that fails twice goes into the record, so only the parts whose tests it touches end with code 2.
      - name: Run the coverage pass of the shard's test files
        env:
          BAZA: ${{ needs.plan.outputs.baza }}
          DO: ${{ needs.plan.outputs.do }}
          CZESC: ${{ matrix.czesc }}/${{ strategy.job-total }}
        run: python tools/mutacje_zmiany.py --baza "$BAZA" --do "$DO" --osadzone .ci-plan/osadzone.json --pokrycie-czesc "$CZESC" --zapis-pokrycia .ci-pokrycie/pokrycie.json --limit-czesci-s 3300

      - name: Upload the coverage record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pokrycie-nocy-${{ matrix.czesc }}
          path: .ci-pokrycie/pokrycie.json
          retention-days: 1
          include-hidden-files: true
          overwrite: true

      # The workflow Zgłoszenia CI files an issue "Flaky test: <test>" for each test of these records, as for a CI run.
      - name: Upload the flaky tests
        if: ${{ !cancelled() && hashFiles('.ci-niestabilne/flaky-testy.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-testy-pokrycie-${{ matrix.czesc }}
          path: .ci-niestabilne/flaky-testy.json
          retention-days: 30
          include-hidden-files: true
          overwrite: true

  change-mutations:
    name: Change mutations (${{ matrix.czesc }}/${{ needs.plan.outputs.liczba }})
    needs:
      - plan
      - pokrycie
    # Also after a failed shard: a part whose test files no record has ends with code 2, the others mutate.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.czesci != '[]' }}
    runs-on: ubuntu-latest
    # A part of NA_CZESC mutations ends in PART_LIMIT_S of tools/mutacje_zmiany.py even with the costliest mutations of
    # the measured nights in every test pass: line tests, file code tests and file tests (tools/mutacje_nocne.py).
    timeout-minutes: 240
    strategy:
      fail-fast: false
      # The organization runs 60 jobs at once, shared with the CI runs of pull requests, and the night takes at most 20 of
      # them: 17 parts and 3 skill jobs. GitHub admits the entries to max-parallel in list order, so the plan puts the
      # costliest first.
      max-parallel: 17
      matrix:
        # Each entry is a part number and przegladarka: its mutations are checked by tests that reach Atrapa efenix.
        include: ${{ fromJSON(needs.plan.outputs.czesci) }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Install dependencies
        # The same as the Linux pytest parts of ci.yml: the tests of tools/ it runs call the real ruff and mypy. The
        # editable install does not hide a mutation: the mutation engine (tools/lib/silnik_mutacji.py) puts the copy's
        # src first.
        run: uv pip install --system --python "${{ steps.python.outputs.python-path }}" -e ".[dev]"

      # As in the pytest parts of ci.yml: test files that reach Atrapa efenix drive a real browser, and the part runs them
      # with its mutations (tools/mutacje_nocne.py marks such a part).
      - name: Chromium
        if: ${{ matrix.przegladarka }}
        uses: ./.github/actions/chromium

      # A missing record is the part's to judge: it ends with code 2 when no record has its test files.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: pokrycie-nocy-*
          path: .ci-pokrycie

      # Without it the part would split another list than the plan.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: osadzone-nocy
          path: .ci-plan

      # Code 1 is surviving mutations and code 3 mutations the part's time limit left without a verdict: results the
      # last job files, so the part stays green. Any other failure (code 2: a test of the part failed twice in the
      # coverage shard, no record has the part's test files, a bad exception) turns the part red, and
      # tools/mutacje_zmiany.py --odtwarzam reproduces it with its own coverage pass. A traceback exits with code 1 too,
      # but writes no record (run 43572533066, part 30/40).
      - name: Mutate the part's changed lines of src/ and tools/
        env:
          BAZA: ${{ needs.plan.outputs.baza }}
          DO: ${{ needs.plan.outputs.do }}
          CZESC: ${{ matrix.czesc }}/${{ needs.plan.outputs.liczba }}
        run: |
          python tools/mutacje_zmiany.py --baza "$BAZA" --do "$DO" --osadzone .ci-plan/osadzone.json --czesc "$CZESC" --pokrycie .ci-pokrycie --zapis .ci-mutacje/czesc.json && exit 0 || kod=$?
          test -f .ci-mutacje/czesc.json && { test "$kod" -eq 1 || test "$kod" -eq 3; }

      - name: Upload the surviving mutations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutacje-nocne-${{ matrix.czesc }}
          path: .ci-mutacje/czesc.json
          retention-days: 30
          if-no-files-found: warn
          include-hidden-files: true
          overwrite: true

  skill-mutations:
    # The steps up to the plan download are those of the Mutation checks job in ci.yml.
    name: ${{ matrix.nazwa }}
    needs: plan
    if: ${{ needs.plan.outputs.skille != '[]' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # tools/ci/zapis_czasow.py reads the step times of this job from the run's jobs API.
      actions: read
    # tools/ci/wykonaj_zadanie.py limits each script to 30 min; this catches a hang in the runner itself.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # With the 17 parts, the night's 20 jobs at once. The 14–16 skill jobs of the nights 9–12.11 took 5.2–5.9
      # runner-hours, so three at a time end in about 2 h, before the parts.
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.skille) }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv pip install --system --python "${{ steps.python.outputs.python-path }}" -e ".[dev]"

      - name: Chromium
        if: ${{ matrix.przegladarka }}
        uses: ./.github/actions/chromium

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan-skilli
          path: .ci-plan

      - name: Restore TLC tools
        id: tlc
        uses: ./.github/actions/narzedzia-tlc

      # A failed script is a result to file, not a broken job: the last job reads the record of each job's units.
      - name: Run the planned mutation scripts
        continue-on-error: true
        run: python tools/ci/wykonaj_zadanie.py --plan .ci-plan/plan.json --zadanie ${{ matrix.id }}

      # The check of the jar only decides the save and never turns the job red.
      - name: Save TLC tools
        if: ${{ !cancelled() && steps.tlc.outputs.trafienie != 'true' }}
        continue-on-error: true
        uses: ./.github/actions/narzedzia-tlc/zapis
        with:
          klucz: ${{ steps.tlc.outputs.klucz }}

      - name: Upload the record of the units
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutacje-skilli-${{ matrix.id }}
          path: .ci-czasy/wykonanie.json
          retention-days: 30
          if-no-files-found: warn
          include-hidden-files: true
          overwrite: true

      # Since 13.11 main runs no mutation script (ADR 0021), so the night is the only measurement of the scripts that
      # pull requests still run; the job czasy-nocy merges these records for the CI plan (tools/lib/czasy_ci.py).
      - name: Record the time of each unit of work
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci/zapis_czasow.py zadanie --tor "${{ runner.os }}-${{ steps.python.outputs.python-version }}" --wykonanie .ci-czasy/wykonanie.json --wyjscie ".ci-czasy/zapis/${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}.json"

      - name: Upload the unit times
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: czasy-zadanie-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .ci-czasy/zapis/
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true

  # The unit times of the skill jobs become the artifact czasy-nocy, as those of a push to main become czasy-ci: the CI
  # plan weighs a mutation script without a time on main by its last nights (tools/lib/czasy_ci.py). Measurement only:
  # a red run would not move the next night's base, so a failure here leaves the run's conclusion alone.
  czasy-nocy:
    name: Czasy skryptów skilli nocy
    needs:
      - plan
      - skill-mutations
    if: ${{ !cancelled() && needs.plan.outputs.skille != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: czasy-zadanie-*
          merge-multiple: true
          path: .ci-czasy/zapisy

      - name: Merge the unit times into czasy-nocy
        run: python3 tools/ci/zapis_czasow.py scal --katalog .ci-czasy/zapisy --wyjscie .ci-czasy/czasy-nocy.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: czasy-nocy
          path: .ci-czasy/czasy-nocy.json
          retention-days: 30
          include-hidden-files: true
          overwrite: true

  zgloszenie:
    name: Zgłoszenie przeżytych mutacji
    needs:
      - plan
      - change-mutations
      - skill-mutations
    # Also after a failed part: the mutations that survived in the other parts still get their issues.
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.czesci != '[]' || needs.plan.outputs.skille != '[]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      # gh api repos/{owner}/{repo}/commits/<sha>/pulls, when the merge commit does not name its PR.
      pull-requests: read
    steps:
      # git blame and the first-parent history of main find the PR that last changed each line.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A missing record is the verdict's to judge, not a failed download.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: mutacje-nocne-*
          path: .ci-mutacje/zapisy

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: mutacje-skilli-*
          path: .ci-mutacje/zapisy

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan-skilli
          path: .ci-plan

      - name: File each surviving mutation in the issue of the PR that last changed its line
        env:
          GH_TOKEN: ${{ github.token }}
          BAZA: ${{ needs.plan.outputs.baza }}
          LICZBA: ${{ needs.plan.outputs.liczba }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 tools/mutacje_nocne.py zglos --baza "$BAZA" --zapisy .ci-mutacje/zapisy --czesci "$LICZBA" --run "$RUN" --plan-skilli .ci-plan/plan.json

  # The night's reading after its filing (tools/mutacje_nocne.py odczyt): wall, runner-hours, backlog, longest part against
  # PART_LIMIT_S and BEZ WERDYKTU, from the run's jobs, the plan log and the part logs, in the run summary and in the one
  # issue with the label noc-mutacji, which stays open while the last night is over a threshold. Measurement only: a red
  # run would not move the next night's base, so a failure here leaves the run's conclusion alone.
  odczyt:
    name: Odczyt nocy
    needs:
      - plan
      - change-mutations
      - skill-mutations
      - czasy-nocy
      - zgloszenie
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.czesci != '[]' || needs.plan.outputs.skille != '[]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      # The jobs of this run and their logs.
      actions: read
      # Creates the label, opens, edits, comments and closes the issue.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the night into the run summary and its issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: python3 tools/mutacje_nocne.py odczyt "$RUN_ID" --issue
