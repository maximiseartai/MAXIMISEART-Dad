name: Mutacje nocne

# Once a day, one mutation per line of src/ and tools/ that changed on main since the last successful night, as
# tools/mutacje_zmiany.py mutates it, and the mutation scripts of the skills whose folder changed since then. A night
# mutates at most CZESCI_NA_NOC parts of NA_CZESC mutations (tools/mutacje_nocne.py): with more, it stops at a commit
# of main, and the next night starts there. Each surviving mutation, and each mutation its part's time limit left
# without a verdict, goes to the issue "Przeżyte mutacje z #N" of the PR that last changed its line, and each failed
# mutation script to "Przeżyte mutacje skilli z #N" of the PR that last changed its skill (tools/mutacje_nocne.py,
# ADR 0021). Pull requests neither run nor wait for it.
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      od:
        description: 'Mutate the changes since this commit (default: where the last successful run stopped, or 24 h back)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # Two runs at once would file the same surviving mutations; a later run waits.
  group: mutacje-nocne
  cancel-in-progress: false

jobs:
  plan:
    name: Plan mutacji nocnych
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The base is the head commit of the last successful run of this workflow.
      actions: read
    outputs:
      baza: ${{ steps.plan.outputs.baza }}
      do: ${{ steps.plan.outputs.do }}
      czesci: ${{ steps.plan.outputs.czesci }}
      liczba: ${{ steps.plan.outputs.liczba }}
      skille: ${{ steps.skille.outputs.mutations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Standard library only, so the runner's python3 runs it as is. The test times of main order the parts, and the
      # skill planner below reads the same download.
      - name: Find the base and split its mutations into parts
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          OD: ${{ inputs.od }}
        run: python3 tools/mutacje_nocne.py plan --od "$OD" --zakres .ci-plan/zakres.json --czasy .ci-plan/czasy

      # The next night reads "do" from the last successful run's artifact: its base, so the backlog is not skipped.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zakres-nocy
          path: .ci-plan/zakres.json
          retention-days: 90
          include-hidden-files: true
          overwrite: true

      # The same planner as Mutation checks in ci.yml: the scripts whose verdict the changes since the base can alter,
      # packed into jobs by their times on main.
      - name: Plan the mutation scripts of the skills changed since the base
        id: skille
        env:
          GH_TOKEN: ${{ github.token }}
          BAZA: ${{ steps.plan.outputs.baza }}
        run: python3 tools/plan_ci.py plan --zdarzenie noc --baza "$BAZA" --czasy .ci-plan/czasy --wyjscie .ci-plan/plan.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-skilli
          path: .ci-plan/plan.json
          retention-days: 30
          include-hidden-files: true
          overwrite: true

  change-mutations:
    name: Change mutations (${{ matrix.czesc }}/${{ needs.plan.outputs.liczba }})
    needs: plan
    if: ${{ needs.plan.outputs.czesci != '[]' }}
    runs-on: ubuntu-latest
    # A part of NA_CZESC mutations ends in PART_LIMIT_S of tools/mutacje_zmiany.py even with the costliest mutations of
    # the measured nights in every test pass: line tests, file code tests and file tests (tools/mutacje_nocne.py).
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # The organization runs 60 jobs at once, shared with the CI runs of pull requests, and the night takes at most 20 of
      # them: 17 parts and 3 skill jobs. GitHub admits the entries to max-parallel in list order, so the plan puts the
      # costliest first.
      max-parallel: 17
      matrix:
        # Each entry is a part number and przegladarka: its mutations are checked by tests that reach Atrapa efenix.
        include: ${{ fromJSON(needs.plan.outputs.czesci) }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Install dependencies
        # The same as the Linux pytest parts of ci.yml: the tests of tools/ it runs call the real ruff and mypy. The
        # editable install does not hide a mutation: the mutation engine (tools/lib/silnik_mutacji.py) puts the copy's
        # src first.
        run: uv pip install --system --python "${{ steps.python.outputs.python-path }}" -e ".[dev]"

      # As in the pytest parts of ci.yml: test files that reach Atrapa efenix drive a real browser, and the part runs them
      # before it mutates (tools/mutacje_nocne.py marks such a part).
      - name: Chromium
        if: ${{ matrix.przegladarka }}
        uses: ./.github/actions/chromium

      # Code 1 is surviving mutations and code 3 mutations the part's time limit left without a verdict: results the
      # last job files, so the part stays green. A test that fails without mutations runs once more, as in the CI of a
      # pull request, and one that passes then is a flaky test, not a failure. Any other failure (code 2: the tests fail
      # twice or hang without mutations, a bad exception) turns the part red, and tools/mutacje_zmiany.py --odtwarzam
      # reproduces it.
      - name: Mutate the part's changed lines of src/ and tools/
        env:
          BAZA: ${{ needs.plan.outputs.baza }}
          DO: ${{ needs.plan.outputs.do }}
          CZESC: ${{ matrix.czesc }}/${{ needs.plan.outputs.liczba }}
        run: python tools/mutacje_zmiany.py --baza "$BAZA" --do "$DO" --czesc "$CZESC" --zapis .ci-mutacje/czesc.json || test $? -eq 1 -o $? -eq 3

      - name: Upload the surviving mutations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutacje-nocne-${{ matrix.czesc }}
          path: .ci-mutacje/czesc.json
          retention-days: 30
          if-no-files-found: warn
          include-hidden-files: true
          overwrite: true

      # The workflow Zgłoszenia CI files an issue "Flaky test: <test>" for each test of these records, as for a CI run.
      - name: Upload the flaky tests
        if: ${{ !cancelled() && hashFiles('.ci-niestabilne/flaky-testy.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-testy-mutacje-${{ matrix.czesc }}
          path: .ci-niestabilne/flaky-testy.json
          retention-days: 30
          include-hidden-files: true
          overwrite: true

  skill-mutations:
    # The steps up to the plan download are those of the Mutation checks job in ci.yml.
    name: ${{ matrix.nazwa }}
    needs: plan
    if: ${{ needs.plan.outputs.skille != '[]' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    # tools/ci/wykonaj_zadanie.py limits each script to 30 min; this catches a hang in the runner itself.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # With the 17 parts, the night's 20 jobs at once. The 14–16 skill jobs of the nights 9–12.11 took 5.2–5.9
      # runner-hours, so three at a time end in about 2 h, before the parts.
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.skille) }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv pip install --system --python "${{ steps.python.outputs.python-path }}" -e ".[dev]"

      - name: Chromium
        if: ${{ matrix.przegladarka }}
        uses: ./.github/actions/chromium

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan-skilli
          path: .ci-plan

      - name: Restore TLC tools
        id: tlc
        uses: ./.github/actions/narzedzia-tlc

      # A failed script is a result to file, not a broken job: the last job reads the record of each job's units.
      - name: Run the planned mutation scripts
        continue-on-error: true
        run: python tools/ci/wykonaj_zadanie.py --plan .ci-plan/plan.json --zadanie ${{ matrix.id }}

      # The check of the jar only decides the save and never turns the job red.
      - name: Save TLC tools
        if: ${{ !cancelled() && steps.tlc.outputs.trafienie != 'true' }}
        continue-on-error: true
        uses: ./.github/actions/narzedzia-tlc/zapis
        with:
          klucz: ${{ steps.tlc.outputs.klucz }}

      - name: Upload the record of the units
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutacje-skilli-${{ matrix.id }}
          path: .ci-czasy/wykonanie.json
          retention-days: 30
          if-no-files-found: warn
          include-hidden-files: true
          overwrite: true

  zgloszenie:
    name: Zgłoszenie przeżytych mutacji
    needs:
      - plan
      - change-mutations
      - skill-mutations
    # Also after a failed part: the mutations that survived in the other parts still get their issues.
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.czesci != '[]' || needs.plan.outputs.skille != '[]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      # gh api repos/{owner}/{repo}/commits/<sha>/pulls, when the merge commit does not name its PR.
      pull-requests: read
    steps:
      # git blame and the first-parent history of main find the PR that last changed each line.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A missing record is the verdict's to judge, not a failed download.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: mutacje-nocne-*
          path: .ci-mutacje/zapisy

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: mutacje-skilli-*
          path: .ci-mutacje/zapisy

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan-skilli
          path: .ci-plan

      - name: File each surviving mutation in the issue of the PR that last changed its line
        env:
          GH_TOKEN: ${{ github.token }}
          BAZA: ${{ needs.plan.outputs.baza }}
          LICZBA: ${{ needs.plan.outputs.liczba }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 tools/mutacje_nocne.py zglos --baza "$BAZA" --zapisy .ci-mutacje/zapisy --czesci "$LICZBA" --run "$RUN" --plan-skilli .ci-plan/plan.json
