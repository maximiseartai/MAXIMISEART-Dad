name: Proba TLC urwane

on:
  push:
    branches:
      - proba/tlc-urwane

permissions:
  contents: read

jobs:
  warianty:
    name: TLC warianty (${{ matrix.kolejnosc }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        kolejnosc:
          - "baza dtemp xms8 w3"
          - "w3 xms8 dtemp baza"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Srodowisko
        shell: pwsh
        run: |
          Get-CimInstance Win32_ComputerSystem | Select-Object NumberOfLogicalProcessors, TotalPhysicalMemory
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, AntivirusEnabled
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free
      - name: Warianty
        shell: pwsh
        env:
          KOLEJNOSC: ${{ matrix.kolejnosc }}
        run: python proba/tlc_warianty.py wszystko @($env:KOLEJNOSC -split ' ')
