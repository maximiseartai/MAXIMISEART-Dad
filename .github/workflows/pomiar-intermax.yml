name: Pomiar INTERMAX (jednorazowy)
on:
  push:
    branches:
      - pomiar/intermax-windows
permissions:
  contents: read
jobs:
  pomiar:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Zależności
        run: python -m pip install -r requirements.txt isal zlib-ng
      - name: Procesor
        run: Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, MaxClockSpeed | Format-List
      - name: Syntetyczny INTERMAX
        run: |
          python tools/pomiar_intermax/syntetyczny.py syn4k.xlsx 4000
          python tools/pomiar_intermax/powiel.py syn4k.xlsx syn.xlsx 10
      - name: zlib
        run: python tools/pomiar_intermax/zlib_pomiar.py syn.xlsx
      - name: main i gałąź naprzemiennie
        run: |
          git worktree add baza origin/main
          foreach ($i in 1..3) {
            Write-Output "main   $(python tools/pomiar_intermax/mierz.py baza syn.xlsx 3)"
            Write-Output "galaz  $(python tools/pomiar_intermax/mierz.py . syn.xlsx 3)"
          }
