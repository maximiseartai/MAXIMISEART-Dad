name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels the run of its older commit. On main the running run finishes, so every
  # Wydanie candidate gets a full verdict, and a newer push replaces only the run still waiting (ADR 0020).
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    # Centrum rozliczeń: the committed build and contract must match their sources (tata has no Node). Beside Ruff and
    # mypy, not after them: one job for both took 47–78 s, so on a short pull request it ended after the pytest jobs.
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false

      - name: Install development dependencies (pinned FastAPI and Pydantic shape the contract)
        run: uv pip install --system --python "${{ steps.python.outputs.python-path }}" -e ".[dev]"

      # Centrum rozliczeń: the committed build and contract must match their sources (tata has no Node).
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate the contract from the server models
        working-directory: frontend
        env:
          PYTHON: python
        run: npm run contract

      - name: Typecheck (tsc strict)
        working-directory: frontend
        run: npm run typecheck

      - name: Lint (Oxlint with anti-slop)
        working-directory: frontend
        run: npm run lint

      - name: Frontend rules (every contract field used, no process-name comparisons)
        working-directory: frontend
        run: npm run rules

      - name: Unused files, exports and dependencies (knip)
        working-directory: frontend
        run: npm run unused

      - name: Duplicated code (jscpd)
        working-directory: frontend
        run: npm run duplicates

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Require the committed contract and build to be fresh
        run: |
          stale="$(git status --porcelain -- frontend/src/api src/rozliczenia/centrum/static)"
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "The committed contract or build does not match its sources. Run 'npm run regen' in frontend/ and commit the result."
            echo "After a merge or rebase this is expected: merge=wygenerowane in .gitattributes keeps the current HEAD's copy of generated files."
            exit 1
          fi

  ruff-mypy:
    # mypy needs no Windows runner, because --platform decides which sys.platform branches it checks; CI checks both
    # systems.
    name: Ruff, mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false

      - name: Install development dependencies
        id: deps
        run: uv pip install --system --python "${{ steps.python.outputs.python-path }}" -e ".[dev]"

      # Each check runs even when an earlier step failed, so one red check does not hide the others.
      - name: Lint Python code
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python -m ruff check

      - name: Typecheck Python code (Windows)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python -m mypy --platform win32

      - name: Typecheck Python code (Linux)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python -m mypy --platform linux

  plan:
    # Decides the pytest and Mutation checks jobs of this run (tools/plan_ci.py), from the unit times of the last green
    # main runs (artifact czasy-ci). Standard library only, so the runner's python3 runs it as is. Mutations of changed
    # lines do not run on a pull request: they run nightly on main (mutacje-nocne.yml, ADR 0021).
    name: Plan CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # tools/ci/czasy_ci.py downloads the artifact czasy-ci of earlier runs.
      actions: read
    outputs:
      pytest: ${{ steps.plan.outputs.pytest }}
      mutations: ${{ steps.plan.outputs.mutations }}
    steps:
      - uses: actions/checkout@v7
        with:
          # On a pull request HEAD is the merge commit and HEAD^1 the base it merges into.
          fetch-depth: 2

      - name: Plan the units of work from the times of the last main runs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/plan_ci.py plan --zdarzenie "${{ github.event_name }}" --baza HEAD^1 --czasy .ci-plan/czasy --wyjscie .ci-plan/plan.json

      - uses: actions/upload-artifact@v7
        with:
          name: plan
          path: .ci-plan/plan.json
          retention-days: 7
          include-hidden-files: true
          # Re-running all jobs plans again; the jobs and Required read the plan of their attempt.
          overwrite: true

  pytest:
    # Tata has Windows; Linux runs the tests Windows skips (POSIX signals, process groups, the pre-push hook). A push to
    # main runs every test file on Windows 3.11, Windows 3.14 and Linux 3.14. A pull request runs on Windows 3.11 (tata's
    # oldest Python) and Linux 3.14 only the files tools/szybko.py selects for the change, plus its structure tests; a
    # change of a path that runs everything in the PR gate (Context.PR_GATE in tools/lib/wplyw_zmiany.py) runs every
    # file (ADR 0020). The plan decides how many jobs each lane runs and which files (or shares of a long file) each
    # takes, so that every job ends near the same time;
    # E2E and the timing guard are units of the Windows jobs it puts them in.
    name: ${{ matrix.nazwa }}
    needs: plan
    if: ${{ needs.plan.outputs.pytest != '[]' }}
    runs-on: ${{ matrix.os }}
    # The last guard: the plan sums the time limits of the job's steps (pytest, its retry, E2E, timing guard) with a
    # margin, so a step limit ends a hang with a LIMIT line first and only a hang outside those steps meets this one.
    timeout-minutes: ${{ matrix.limit_minut }}
    permissions:
      contents: read
      # tools/ci/czasy_ci.py reads the step times of this job from the run's jobs API.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.pytest) }}
    env:
      EXPECTED_PYTHON_VERSION: ${{ matrix.python }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7

      - id: python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false

      - name: Route py -3 to the selected Python
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\.github\scripts" -Encoding utf8

      - name: Verify py -3 interpreter
        if: ${{ runner.os == 'Windows' }}
        run: |
          $actualVersion = py -3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')"
          if ($actualVersion -ne $env:EXPECTED_PYTHON_VERSION) {
            throw "py -3 resolved to Python $actualVersion; expected $env:EXPECTED_PYTHON_VERSION."
          }

      - name: Install test dependencies
        if: ${{ runner.os == 'Windows' }}
        run: uv pip install --system --python "${{ steps.python.outputs.python-path }}" -r requirements.txt

      - name: Install test dependencies (Linux)
        if: ${{ runner.os == 'Linux' }}
        # The pre-push hook test runs the real ruff and mypy from tools/ci_lokalnie.py.
        run: uv pip install --system --python "${{ steps.python.outputs.python-path }}" -e ".[dev]"

      # Test files that reach Atrapa efenix (tests/fixtures/atrapa_efenix.py) drive a real browser, in the test or through
      # the machine script; the plan marks the jobs that run them. Playwright comes with the tool's dependencies, so only its browser is missing.
      - name: Playwright version
        id: playwright
        if: ${{ matrix.przegladarka }}
        shell: bash
        run: python -c "from importlib.metadata import version; print('version=' + version('playwright'))" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        if: ${{ matrix.przegladarka }}
        uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\ms-playwright' || '~/.cache/ms-playwright' }}
          key: chromium-headless-shell-${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      # Linux also needs the system libraries of the headless shell, which the cache does not hold.
      - name: Install Chromium
        if: ${{ matrix.przegladarka }}
        run: python -m playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} --only-shell chromium

      - uses: actions/download-artifact@v8
        with:
          name: plan
          path: .ci-plan

      # pytest with the job's files longest first, then its steps (E2E, timing guard), each with its own time limit,
      # also after red tests. On a pull request the tests that failed run once more; passing then makes them flaky.
      - name: Run the planned units
        id: units
        run: python tools/plan_ci.py wykonaj --plan .ci-plan/plan.json --zadanie ${{ matrix.id }}

      # Tests that passed only on their retry; the workflow zgloszenia.yml files an issue "Flaky test: <test>" for each.
      - name: Upload the flaky tests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: flaky-testy-${{ matrix.id }}-${{ github.run_attempt }}
          path: .ci-niestabilne/flaky-testy.json
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

      # Quarantined tests do not turn Required red, so tools/wydanie.py reads their results on the main commit.
      - name: Upload the results of quarantined tests
        if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: kwarantanna-${{ matrix.id }}-${{ github.run_attempt }}
          path: .ci-niestabilne/kwarantanna.json
          retention-days: 30
          if-no-files-found: warn
          include-hidden-files: true

      - name: Upload E2E and timing guard evidence on failure
        if: ${{ failure() && steps.units.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ matrix.id }}-${{ github.run_attempt }}
          path: |
            .verification/evidence/
            ${{ runner.temp }}/lustro/ostatni-blad-*.txt
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

      # Measurement and the proof that the planned units ran: Required checks the record against the plan.
      - name: Record the time of each unit of work
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci/czasy_ci.py zadanie --tor "${{ runner.os }}-${{ steps.python.outputs.python-version }}" --junit .ci-czasy/junit.xml --wykonanie .ci-czasy/wykonanie.json --wyjscie ".ci-czasy/zapis/${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}.json"

      - name: Upload the unit times
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: czasy-zadanie-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .ci-czasy/zapis/
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true

  mutations:
    # A mutation check's verdict does not depend on the Python version, so it runs once, beside pytest.
    # It runs the skill's own check on unchanged code (the ci: key of its SKILL.md), so agents need not run it on the
    # Mac: Centrum --feature all and the TLA+ model of Aktualizacja narzędzia run only here. A skill's mutation scripts
    # run here only on a push to main; for a pull request they run at night (mutacje-nocne.yml, ADR 0021).
    # The plan takes the steps whose verdict the pull request can alter (all on a push to main), packs them into jobs by
    # their CI time and splits a long mutation script into parts; each job runs its steps one by one, because side by
    # side on one runner they exceed their time limits.
    name: ${{ matrix.nazwa }}
    needs: plan
    if: ${{ needs.plan.outputs.mutations != '[]' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # tools/ci/czasy_ci.py reads the step times of this job from the run's jobs API.
      actions: read
    # tools/ci/mutacje_skilli.py limits each script to 30 min; this catches a hang in the runner itself.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.mutations) }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7

      - id: python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv pip install --system --python "${{ steps.python.outputs.python-path }}" -r requirements.txt

      # verify-centrum-rozliczen drives Centrum in Chromium; the plan marks the jobs that run its steps. Only the browser
      # packages pinned in the dev extra of pyproject.toml (Playwright, and tzdata for Dad's time zone on Windows), not
      # the whole extra: skill scripts add src to sys.path themselves, so the package need not be installed.
      - name: Install Playwright
        id: playwright
        if: ${{ matrix.przegladarka }}
        run: |
          $packages = python -c "import tomllib; dev = tomllib.load(open('pyproject.toml', 'rb'))['project']['optional-dependencies']['dev']; print(' '.join(p.replace(' ', '') for p in dev if p.startswith(('playwright==', 'tzdata=='))))"
          uv pip install --system --python "${{ steps.python.outputs.python-path }}" $packages.Split(' ')
          python -c "from importlib.metadata import version; print('version=' + version('playwright'))" >> $env:GITHUB_OUTPUT

      # One playwright version always downloads the same browser, so the jobs share it; on a hit the install below
      # finds it in place. Headless Chromium runs the headless shell alone, a third of the full browser's size.
      - name: Cache Chromium
        if: ${{ matrix.przegladarka }}
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\ms-playwright
          key: chromium-headless-shell-${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: ${{ matrix.przegladarka }}
        run: python -m playwright install --only-shell chromium

      - uses: actions/download-artifact@v8
        with:
          name: plan
          path: .ci-plan

      # Each baseline and mutation script (or part of one) of the job, also after a red one.
      - name: Run the planned units
        id: units
        run: python tools/plan_ci.py wykonaj --plan .ci-plan/plan.json --zadanie ${{ matrix.id }}

      # A red baseline (e.g. Centrum --feature all) leaves its screenshots and logs here; mutation copies keep none.
      - name: Upload baseline evidence on failure
        if: ${{ failure() && steps.units.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ matrix.id }}-${{ github.run_attempt }}
          path: .verification/evidence/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

      # Measurement and the proof that the planned units ran: Required checks the record against the plan.
      - name: Record the time of each unit of work
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci/czasy_ci.py zadanie --tor "${{ runner.os }}-${{ steps.python.outputs.python-version }}" --wykonanie .ci-czasy/wykonanie.json --wyjscie ".ci-czasy/zapis/${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}.json"

      - name: Upload the unit times
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: czasy-zadanie-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .ci-czasy/zapis/
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true

  required:
    # Configure only this stable status as required in branch protection.
    # It passes when every job of the run succeeded, a job was skipped only because the plan gave it no work, and every
    # pytest and Mutation checks job of the plan reported each of its units, passed in its latest attempt (no test file
    # or skill step lost between jobs).
    name: Required CI status
    runs-on: ubuntu-latest
    needs:
      - plan
      - frontend
      - ruff-mypy
      - pytest
      - mutations
    # Also in a cancelled run: a skipped required check counts as success and would not block the merge.
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools

      # A missing plan or record is the verdict's to judge, not a failed download.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: plan
          path: .ci-plan

      - name: Download the unit times of every job of this run
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: czasy-zadanie-*
          merge-multiple: true
          path: .ci-czasy/zapisy

      - name: Require every CI check to succeed and every planned unit to report
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/plan_ci.py werdykt --plan .ci-plan/plan.json --zapisy .ci-czasy/zapisy

      # On a push to main the unit times of every job of the run become the artifact czasy-ci, the one source of CI
      # times (tools/ci/czasy_ci.py). Measurement only: a failure here prints CZASY CI FAIL and leaves the verdict above.
      - name: Merge the unit times into czasy-ci
        if: ${{ !cancelled() && github.event_name == 'push' }}
        continue-on-error: true
        run: python3 tools/ci/czasy_ci.py scal --katalog .ci-czasy/zapisy --wyjscie .ci-czasy/czasy-ci.json

      - name: Upload czasy-ci
        if: ${{ !cancelled() && github.event_name == 'push' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: czasy-ci
          path: .ci-czasy/czasy-ci.json
          retention-days: 30
          if-no-files-found: warn
          include-hidden-files: true
          overwrite: true
