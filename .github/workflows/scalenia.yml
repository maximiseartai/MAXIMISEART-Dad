name: Scalenia otwartych PR

# After every push to main, each open PR to main gets the commit status "scalenie z main": does its merge with the
# new main pass without a conflict, and do ruff and mypy pass on it (tools/ci/status_scalenia.py). This run writes the
# verdicts to the artifact "scalenia", and werdykt-i-bramka.yml sets them as statuses with main's code.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      baza:
        description: 'Check open PRs to this branch, merged with its tip'
        required: false
        default: main

# The job runs code from same-repository PR branches, as ci.yml does, so its token cannot write commit statuses: only
# werdykt-i-bramka.yml has statuses: write (tests/test_zadania_ci.py). tools/ci/status_scalenia.py skips PRs from forks.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: scalenia-${{ inputs.baza || 'main' }}
  cancel-in-progress: true

jobs:
  scalenia:
    name: Scalenia otwartych PR z bazą
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Since Git 2.54 a fetch starts `git maintenance run --auto` detached, and its `git worktree prune` can delete the
    # worktree that potomne.commit_copy is adding (#312); the job env reaches every git, actions/checkout included.
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: maintenance.auto
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Check each open PR merged with its base
        env:
          GH_TOKEN: ${{ github.token }}
          BAZA: ${{ inputs.baza || 'main' }}
        run: python tools/ci/status_scalenia.py --zapisz scalenia.json --baza "$BAZA"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scalenia
          path: scalenia.json
          retention-days: 1
