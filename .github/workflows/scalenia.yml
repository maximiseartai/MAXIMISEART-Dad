name: Scalenia otwartych PR

# After every push to main, each open PR to main gets the commit status "scalenie z main": does its merge with the
# new main pass without a conflict, and do ruff and mypy pass on it (tools/ci/status_scalenia.py).
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      baza:
        description: 'Check open PRs to this branch, merged with its tip'
        required: false
        default: main

# The job runs code from same-repository PR branches, as ci.yml does; tools/ci/status_scalenia.py skips PRs from forks,
# because this token can write any commit status, also the one the ruleset requires.
permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: scalenia-${{ inputs.baza || 'main' }}
  cancel-in-progress: true

jobs:
  scalenia:
    name: Scalenia otwartych PR z bazą
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Since Git 2.54 a fetch starts `git maintenance run --auto` detached, and its `git worktree prune` can delete the
    # worktree that potomne.commit_copy is adding (#312); the job env reaches every git, actions/checkout included.
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: maintenance.auto
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Check each open PR merged with its base and set its status
        env:
          GH_TOKEN: ${{ github.token }}
          BAZA: ${{ inputs.baza || 'main' }}
        run: python tools/ci/status_scalenia.py --publikuj --baza "$BAZA"
