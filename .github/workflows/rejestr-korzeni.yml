name: Rejestr korzeni

# Every Monday at 6:17 Polish time: the numbers of the root registry since the deployment of the verdict template, the
# guard firings in the failed CI runs of the last full week, the widenings of the rules and the history of weeks go into
# the body of the one issue "Rejestr korzeni" (label rejestr-korzeni), before the hunt of the skill polowanie at 8:00
# reads it (tools/rejestr_korzeni_tydzien.py, ADR 0031, ADR 0046). Minute 17, not the full hour: GitHub delays scheduled
# runs at the start of an hour and drops some under high load. GitHub's cron runs in UTC, so 6:17 in Warsaw is 5:17 UTC
# in winter time (CET, UTC+1) and 4:17 UTC in summer time (CEST, UTC+2): the workflow has both crons, and the tool gets
# the cron that started it and goes on only when that cron is in hour 6 in Warsaw on that day (Poland changes the time
# on a Sunday, so a Monday has one offset). The other cron ends with a line "REJESTR KORZENI POMINIĘTY". A manual run
# (workflow_dispatch) has no cron and always measures.
# Cost: GraphQL pages of the registry scan with the HTML of every body, no render per verdict; the budget of
# GITHUB_TOKEN (1000 GraphQL points an hour per repository) is in ZASADY of tools/lib/rejestr_korzeni.py. The
# ast-grep rules on the lines added by the last 20 merged PRs took 144 s on a Mac on 18.11.2026. The guard firings
# read a REST page of failed CI runs per 100, the jobs of each and the log of each failed job (OPIS of the tool).
on:
  schedule:
    - cron: '17 5 * * 1'
    - cron: '17 4 * * 1'
  workflow_dispatch:

# issues: write edits or opens the issue and creates its label; pull-requests: read reads the verdicts and bodies of the
# PRs (GraphQL search); contents: read fetches main, whose first-parent history gives the moment of the deployment and
# the widenings of the rules; actions: read lists the failed CI runs of the week, their jobs and their logs.
permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  # Two runs at once could both miss the issue and both open one; a later run waits.
  group: rejestr-korzeni
  cancel-in-progress: false

jobs:
  rejestr:
    name: Rejestr korzeni
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      # The firings of the rules on the last merged PRs need ast-grep. Its pin comes from pyproject.toml (the dev extra,
      # as in CI), and -r installs only the dependencies, so no build of the project runs.
      - name: Install ast-grep
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: uv pip install --system --python "$PYTHON" -r pyproject.toml --extra dev

      - name: Update the issue "Rejestr korzeni" with the last full week
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CRON: ${{ github.event.schedule }}
        run: python tools/rejestr_korzeni_tydzien.py --cron "$CRON"
