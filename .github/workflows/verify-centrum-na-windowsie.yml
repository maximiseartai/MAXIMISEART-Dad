name: Verify Centrum na Windowsie

# The skill verify-centrum-na-windowsie on a fresh Windows machine: Dad's installation, the shortcut, native windows,
# and Aktualizacja narzędzia with the restart guardian. It runs on changes to what only Windows can prove, and on
# demand (`run_on_github.py` in the skill dispatches it and downloads the evidence).
on:
  workflow_dispatch:
    inputs:
      feature:
        description: 'all or one feature with its file in features/'
        required: false
        default: all
  pull_request:
    paths: &windows_paths
      - .github/workflows/verify-centrum-na-windowsie.yml
      - .agents/skills/verify-centrum-na-windowsie/**
      - run_centrum.py
      - install_centrum_shortcut.py
      - frontend/src/lib/tool-update.tsx
      - requirements.txt
      - src/rozliczenia/centrum/launcher.py
      - src/rozliczenia/centrum/platform.py
      - src/rozliczenia/centrum/shortcut.py
      - src/rozliczenia/centrum/centrum-rozliczen.ico
      - src/rozliczenia/centrum/settings.py
      - src/rozliczenia/centrum/server.py
      - src/rozliczenia/centrum/shutdown.py
      - src/rozliczenia/centrum/start_problems.py
      - src/rozliczenia/centrum/log.py
      - src/rozliczenia/centrum/restart_guardian.py
      - src/rozliczenia/centrum/tool_update.py
      - src/rozliczenia/centrum/tool_updates.py
      - src/rozliczenia/centrum/update_messages.py
      - src/rozliczenia/centrum/version.py
      - tests/fixtures/scenariusz_centrum.py
      - .agents/skills/verify-centrum-rozliczen/scripts/create_centrum_fixture.py
  push:
    branches:
      - main
    paths: *windows_paths

permissions:
  contents: read

# A newer push to a pull request cancels its running run. Other runs are never cancelled once they run; GitHub still
# replaces a waiting run with a newer one of the same event and branch.
concurrency:
  group: verify-centrum-na-windowsie-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify Centrum na Windowsie
    runs-on: windows-latest
    timeout-minutes: 45
    # No PYTHONUTF8: Dad's Python runs with Windows' own code page, and so does this run.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install the drive (Playwright and Chromium)
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m playwright install chromium

      - name: Drive Dad's Windows path
        shell: pwsh
        env:
          FEATURE: ${{ inputs.feature || 'all' }}
        run: |
          python .agents/skills/verify-centrum-na-windowsie/scripts/run_windows_verification.py --feature $env:FEATURE
          if ($LASTEXITCODE -ne 0) {
            throw "verify-centrum-na-windowsie failed (exit code $LASTEXITCODE)"
          }

      - name: Upload the evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: verify-centrum-na-windowsie-${{ github.run_id }}-${{ github.run_attempt }}
          path: .verification/evidence/
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
